<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ekko of Beyond · Vue du ciel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#E3E3C4;
  --cream-50:rgba(227,227,196,.5);
  --cream-25:rgba(227,227,196,.25);
  --ink:#060A10;
  --card:#08141D;
  --w-50:rgba(255,255,255,.5);
  --w-30:rgba(255,255,255,.3);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  /* géométrie du header, reprise de la maquette */
  --hd-h:89px;      /* hauteur de la barre */
  --notch-d:9px;    /* profondeur de la défonce */
  --notch-w:348px;  /* largeur totale de la défonce */
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Afacad',system-ui,sans-serif;color:#fff;
  background:linear-gradient(180deg,#000 0%,#0A1931 100%);
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ================= CIEL ================= */
/* Aucun filtre CSS sur le canvas : le ciel garde ses couleurs vraies.
   Le moteur code en dur le cyan des tracés de constellations, dans
   src/modules/constellations.c :
       vec4_set(lines_color, 0.65, 1.0, 1.0, 0.4);
   Aucun filtre global ne peut le convertir en #E3E3C4 sans abîmer le
   reste : préserver les gris impose que chaque ligne de la matrice somme
   à 1, et sous cette contrainte décyaniser les tracés revient à vider le
   canal rouge, donc à détruire Mars, Saturne et les étoiles orangées.
   La seule vraie solution est de recompiler le moteur avec la couleur
   crème — une seule ligne à changer. */
#stel-canvas{
  position:fixed;inset:0;width:100%;height:100%;z-index:1;touch-action:none;
}
#fallback-stars{position:fixed;inset:0;z-index:0;pointer-events:none;transition:opacity 1.2s}
/* Ellipse 297 de la maquette : 2178 x 943 px dans un cadre de 1440 x 1024,
   posée à 403 px du haut — elle dépasse donc de 322 px sous le bas de page.
   Ramené en unités relatives : 151vw x 92vh, bottom -31.4vh. Fusion
   color-dodge, comme dans Figma. */
.horizon-glow{
  position:fixed;left:50%;bottom:-31.4vh;transform:translateX(-50%);
  width:151vw;height:92vh;z-index:2;pointer-events:none;
  mix-blend-mode:color-dodge;
  background:radial-gradient(50% 50% at 50% 50%,
    rgba(96,170,196,.62) 0%,
    rgba(58,118,146,.34) 34%,
    rgba(30,68,92,.14) 58%,
    transparent 74%);
}

/* ================= HEADER ================= */
.hd-bg{
  position:fixed;top:0;left:0;right:0;height:calc(var(--hd-h) + var(--safe-t));z-index:9;pointer-events:none;
  background:linear-gradient(180deg,
    rgba(4,7,12,.97) 0%,
    rgba(5,9,15,.94) 42%,
    rgba(8,18,33,.86) 78%,
    rgba(10,25,49,.74) 100%);
}
header{
  position:fixed;top:0;left:0;right:0;z-index:11;
  height:calc(var(--hd-h) + var(--safe-t));
  padding:calc(27px + var(--safe-t)) 80px 27px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
}
/* bloc miroir invisible : centre le logo exactement comme dans Figma */
.hd-mirror{opacity:0;pointer-events:none}
.account{display:flex;align-items:center;gap:15px;flex:none}
.account .ico{width:29.33px;height:30px;flex:none;display:block}
.account .ico svg{width:100%;height:100%;display:block;overflow:visible}
a.account{text-decoration:none}
.account .lbl{font-weight:700;font-size:18px;line-height:normal;text-transform:uppercase;color:var(--cream);white-space:nowrap}
.logo{width:324.7px;height:45px;flex:none;display:block}
.logo svg{width:100%;height:100%;display:block}

/* ---- la défonce : hairline + tab centré ---- */
.hd-edge{
  position:fixed;left:0;right:0;top:calc(var(--hd-h) + var(--safe-t) + 1px);
  height:var(--notch-d);z-index:11;pointer-events:none;
  display:flex;align-items:flex-start;justify-content:center;
}
.hd-edge .side{flex:1 1 auto;height:1px;background:var(--cream-50)}
.hd-edge .notch{flex:none;width:var(--notch-w);height:auto;display:block;overflow:visible}
/* la forme suspendue sous le logo (arc + point + filet) */
.hd-drop{
  position:fixed;left:50%;transform:translateX(-50%);
  top:calc(var(--hd-h) + var(--safe-t) + var(--notch-d) + 1px);
  width:68px;height:53px;z-index:11;pointer-events:none;overflow:hidden;
}
.hd-drop svg{width:100%;height:100%;display:block;overflow:visible}

/* ================= TOGGLE ================= */
.toggle-wrap{
  position:fixed;left:50%;transform:translateX(-50%);
  top:calc(162px + var(--safe-t));z-index:11;
  display:flex;align-items:center;
}
.orn{display:flex;align-items:center;gap:5px;flex:none}
.orn .d5{width:5px;height:5px;border-radius:50%;background:var(--cream);flex:none}
.orn .r7{width:7px;height:7px;border-radius:50%;border:1px solid var(--cream);flex:none}
.orn .ln{width:20px;height:1px;background:var(--cream-50);flex:none}
.toggle{
  display:flex;align-items:stretch;flex:none;
  border:1px solid var(--cream-50);border-radius:20000px;
  background:linear-gradient(180deg,rgba(227,227,196,.03) 0%,rgba(227,227,196,.10) 100%);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.tg{
  display:flex;align-items:center;justify-content:center;
  padding:15px 50px;border-radius:20000px;
  font-weight:700;font-size:18px;line-height:normal;text-transform:uppercase;text-align:center;
  color:var(--cream);opacity:.5;white-space:nowrap;transition:opacity .2s,background .2s;
}
.tg + .tg{padding-left:40px}
.tg.on{background:var(--cream);color:var(--ink);opacity:1;padding-left:50px;padding-right:50px}
.tg:not(.on):hover{opacity:.75}

/* ================= ZOOM ================= */
.zoom{position:fixed;right:39.7px;bottom:calc(40px + var(--safe-b));z-index:11;display:flex;flex-direction:column;gap:5px}
.zbtn{
  width:50px;height:50px;border-radius:50%;flex:none;
  border:1.064px solid var(--cream);
  background:linear-gradient(180deg,rgba(227,227,196,.04) 0%,rgba(227,227,196,.2) 100%);
  display:flex;align-items:center;justify-content:center;transition:background .2s}
.zbtn:active{background:rgba(227,227,196,.32)}
.zbtn svg{width:24px;height:24px;display:block}

/* ================= CARTE ================= */
.card-row{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(40px + var(--safe-b));z-index:11;
  display:flex;align-items:center;
}
.nav-side{display:flex;align-items:center;gap:5px;height:54px;flex:none}
.nav-side .ln{width:40px;height:1px;background:var(--w-50);flex:none}
.nav-side .d5{width:5px;height:5px;border-radius:50%;background:#fff;flex:none}
.nav-side .r7{width:7px;height:7px;border-radius:50%;border:1px solid #fff;flex:none}
.nav-btn{
  width:50px;height:50px;border-radius:50%;flex:none;
  border:1px solid var(--w-50);background:rgba(6,10,16,.45);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;transition:border-color .2s,background .2s}
.nav-btn:active{background:rgba(227,227,196,.16);border-color:var(--cream)}
.nav-btn svg{width:16px;height:16px;display:block}
.card{
  width:560px;flex:none;position:relative;
  border:1px solid var(--w-50);border-radius:8px;
  padding:20px 30px;display:flex;gap:30px;align-items:center;
  background:
    radial-gradient(118% 150% at 88% -28%,rgba(46,82,104,.55) 0%,rgba(20,42,58,.18) 46%,transparent 72%),
    var(--card);
  box-shadow:0 20px 54px rgba(0,0,0,.5);
}
.medallion{width:100px;height:100px;flex:none;opacity:.75;position:relative}
.medallion svg{width:100%;height:100%;display:block}
.card-body{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:7px}
.chips{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:2px 10px;border-radius:2000px;
  font-weight:700;font-size:10px;line-height:1.5;text-transform:uppercase;color:#fff;white-space:nowrap;flex:none}
.chip.cat{background:var(--w-30);opacity:.75}
.chip.vis{border:1px solid #fff}
.chip.vis svg{width:9.5px;height:10px;display:block;flex:none}
.card-txt{display:flex;flex-direction:column;align-items:flex-start;opacity:.75;width:100%}
.c-title{font-weight:700;font-size:22px;line-height:normal;text-transform:uppercase;width:100%}
.c-desc{font-weight:400;font-size:14px;line-height:1.2;width:100%;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.c-state{display:flex;align-items:center;gap:5px;width:368px;max-width:100%;margin-top:0}
.c-state .ln{flex:1 1 0;min-width:0;height:1px;background:var(--w-50)}
.c-state .r7{width:7px;height:7px;border-radius:50%;border:1px solid #fff;flex:none}
.c-state .d5{width:5px;height:5px;border-radius:50%;background:#fff;flex:none}
.c-state .pill{
  border:1px solid var(--w-30);border-radius:2000px;padding:2px 10px;flex:none;
  font-weight:700;font-size:10px;line-height:1.5;text-transform:uppercase;color:#fff;white-space:nowrap}
.c-state .pill.got{border-color:var(--cream-50);color:var(--cream)}

.c-pos{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(152px + var(--safe-b));z-index:11;
  font-weight:700;font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--cream-50);pointer-events:none;white-space:nowrap}

/* ================= RETICULE ================= */
#reticle{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.84);
  width:min(44vmin,400px);height:min(44vmin,400px);z-index:5;pointer-events:none;
  opacity:0;transition:opacity .5s ease,transform .9s cubic-bezier(.2,.9,.3,1)}
#reticle.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#reticle svg{width:100%;height:100%;overflow:visible}
#reticle .spin{transform-origin:50% 50%;animation:ret-spin 34s linear infinite}
@keyframes ret-spin{to{transform:rotate(360deg)}}

/* ================= STATUT ================= */
#status{
  position:fixed;left:50%;transform:translateX(-50%);top:calc(232px + var(--safe-t));z-index:12;
  font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream-50);
  background:rgba(6,10,16,.6);border:1px solid var(--cream-25);border-radius:2000px;
  padding:8px 18px;backdrop-filter:blur(8px);transition:opacity .8s;text-align:center;max-width:88vw}
#status.off{opacity:0;pointer-events:none}

/* ================= RESPONSIVE ================= */
@media (max-width:1180px){
  header{padding-left:32px;padding-right:32px}
  .hd-mirror{display:none}
  header{justify-content:center;position:fixed}
  .account{position:fixed;right:32px;top:calc(27px + var(--safe-t));z-index:12}
}
@media (max-width:820px){
  .c-pos{bottom:calc(118px + var(--safe-b));font-size:10px}
  :root{--hd-h:72px;--notch-w:210px;--notch-d:7px}
  header{padding:calc(18px + var(--safe-t)) 18px 18px}
  .logo{width:220px;height:30.5px}
  .account{right:18px;top:calc(20px + var(--safe-t));gap:0}
  a.account{text-decoration:none}
.account .lbl{display:none}
  .account .ico{width:26px;height:26.6px}
  .hd-drop{width:54px;height:42px}
  .toggle-wrap{top:calc(112px + var(--safe-t))}
  .tg{padding:11px 26px;font-size:14px}
  .tg + .tg{padding-left:20px}
  .tg.on{padding-left:26px;padding-right:26px}
  .orn .ln{width:12px}
  #status{top:calc(172px + var(--safe-t));font-size:11px;padding:7px 14px}
  .zoom{right:14px;bottom:calc(196px + var(--safe-b))}
  .zbtn{width:44px;height:44px}
  .zbtn svg{width:20px;height:20px}
  .card-row{width:100%;padding:0 12px;bottom:calc(16px + var(--safe-b))}
  .nav-side{position:absolute;top:50%;transform:translateY(-50%);z-index:3;gap:0}
  .nav-side .ln,.nav-side .d5,.nav-side .r7{display:none}
  .nav-side.prev{left:20px}
  .nav-side.next{right:20px}
  .nav-btn{width:40px;height:40px;background:rgba(6,10,16,.72)}
  .card{width:100%;padding:16px 14px;gap:14px}
  .medallion{width:66px;height:66px}
  .c-title{font-size:18px}
  .c-desc{font-size:13px}
  .c-state{width:100%}
}
@media (max-width:400px){
  .medallion{width:56px;height:56px}
  .chips{flex-wrap:wrap;gap:6px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- astronomie : visibilité depuis la position ---------- */
const GEO = { lat:37.18, lon:-3.60 };
function lstHours(date, lonDeg){
  const jd = date.getTime()/86400000 + 2440587.5, d = jd - 2451545.0;
  let lst = (18.697374558 + 24.06570982441908*d + lonDeg/15) % 24;
  return lst < 0 ? lst + 24 : lst;
}
function altOf(raH, decD, date){
  const H = (lstHours(date, GEO.lon) - raH) * 15 * Math.PI/180;
  const dec = decD*Math.PI/180, lat = GEO.lat*Math.PI/180;
  const s = Math.sin(lat)*Math.sin(dec) + Math.cos(lat)*Math.cos(dec)*Math.cos(H);
  return Math.asin(Math.max(-1, Math.min(1, s)));
}
function centroidRaDec(c){
  let x=0, y=0, dec=0;
  c.stars.forEach(s => { const a = s.ra/24*2*Math.PI; x += Math.cos(a); y += Math.sin(a); dec += s.dec; });
  let ra = Math.atan2(y,x)/(2*Math.PI)*24; if(ra < 0) ra += 24;
  return { ra, dec: dec/c.stars.length };
}
const VIS_ALT = 12*Math.PI/180;
function visibility(c){
  const { ra, dec } = centroidRaDec(c);
  if(90 - Math.abs(GEO.lat - dec) < 12) return { code:'never' };
  const now = new Date();
  if(altOf(ra, dec, now) > VIS_ALT) return { code:'now' };
  for(let m=10; m<=300; m+=10){
    const t = new Date(now.getTime() + m*60000);
    if(altOf(ra, dec, t) > VIS_ALT) return { code:'soon', at:t };
  }
  for(let d=1; d<=370; d+=3){
    const t = new Date(now); t.setDate(t.getDate()+d); t.setHours(22,0,0,0);
    if(altOf(ra, dec, t) > VIS_ALT) return { code:'later', at:t };
  }
  return { code:'later', at:null };
}
const fmtTime = d => d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
const fmtDate = d => d.toLocaleDateString('fr-FR', { day:'numeric', month:'long' });

/* ---------- médaillon ---------- */
function medallionSVG(c){
  let ras = c.stars.map(s => s.ra);
  if(Math.max(...ras) - Math.min(...ras) > 12) ras = ras.map(r => r < 12 ? r+24 : r);
  const decs = c.stars.map(s => s.dec);
  const mR = Math.min(...ras), MR = Math.max(...ras), mD = Math.min(...decs), MD = Math.max(...decs);
  const pts = c.stars.map((s,i) => ({
    x: 28 + (1 - (ras[i]-mR)/((MR-mR)||1)) * 44,
    y: 28 + (1 - (s.dec-mD)/((MD-mD)||1)) * 44
  }));
  let o = '<svg viewBox="0 0 100 100">';
  o += '<circle cx="50" cy="50" r="49.6" fill="none" stroke="#E3E3C4" stroke-width="0.8"/>';
  o += '<circle cx="50" cy="50" r="41" fill="none" stroke="rgba(227,227,196,.3)" stroke-width="0.8"/>';
  c.lines.forEach(([a,b]) => {
    o += '<line x1="'+pts[a].x.toFixed(1)+'" y1="'+pts[a].y.toFixed(1)+'" x2="'+pts[b].x.toFixed(1)+'" y2="'+pts[b].y.toFixed(1)+'" stroke="#E3E3C4" stroke-width="0.8"/>';
  });
  pts.forEach(p => { o += '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="1.7" fill="#E3E3C4"/>'; });
  return o + '</svg>';
}

/* Sélectionne la constellation dans le moteur. C'est la sélection qui
   déclenche l'apparition en fondu du dessin de la figure : le moteur
   ignore le réglage images_visible pour l'objet sélectionné. */
/* Fait pivoter la vue pour que la figure apparaisse dans le sens ou elle
   a ete dessinee. Le repere OBSERVED du moteur a le zenith en (0,0,1) :
   sans roulis, le haut de l'ecran pointe donc vers le zenith. On mesure
   l'angle entre cette direction et le haut de l'image, et on le donne a
   l'attribut roll de l'observateur. */
/* Anime le roulis jusqu'a la valeur voulue, par le chemin le plus court et
   avec la meme duree que le vol de camera : les deux mouvements se
   deroulent alors ensemble, sans le saut d'une rotation instantanee. */
let rollAnim = null;
function animateRoll(target, dur){
  cancelAnimationFrame(rollAnim);
  let from = 0;
  try{ from = STEL.core.observer.roll || 0; }catch(e){}
  const TAU = Math.PI * 2;
  const delta = ((target - from + Math.PI) % TAU + TAU) % TAU - Math.PI;
  if(!dur || Math.abs(delta) < 1e-4){
    try{ STEL.core.observer.roll = target; }catch(e){}
    return;
  }
  const t0 = performance.now(), ms = dur * 1000;
  const step = function(now){
    const k = Math.min(1, (now - t0) / ms);
    /* meme courbe que le vol : acceleration puis freinage */
    const e = k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
    try{ STEL.core.observer.roll = from + delta * e; }catch(err){}
    if(k < 1) rollAnim = requestAnimationFrame(step);
  };
  rollAnim = requestAnimationFrame(step);
}

function orientToFigure(idx, dur){
  if(!STEL) return;
  const o = ORIENT[CONSTELLATIONS[idx].id];
  if(!o){ animateRoll(0, dur); return; }
  const D2R = STEL.D2R;
  const dot = (a,b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
  const nrm = v => { const n = Math.hypot(v[0],v[1],v[2]) || 1; return [v[0]/n, v[1]/n, v[2]/n]; };
  const crs = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  try{
    const obs = STEL.core.observer;
    const c = nrm(STEL.convertFrame(obs, 'ICRF', 'OBSERVED', STEL.s2c(o[0]*15*D2R, o[1]*D2R)));
    const u = nrm(STEL.convertFrame(obs, 'ICRF', 'OBSERVED', STEL.s2c(o[2]*15*D2R, o[3]*D2R)));
    const Z = [0, 0, 1];
    if(Math.abs(dot(Z, c)) > 0.999) return;   /* figure au zenith : le haut n'est pas defini */
    const tang = v => { const d = dot(v, c); return nrm([v[0]-d*c[0], v[1]-d*c[1], v[2]-d*c[2]]); };
    const up = tang(u), u0 = tang(Z);
    const theta = Math.atan2(dot(crs(u0, up), c), dot(u0, up));
    const adj = (ROLL_ADJUST[CONSTELLATIONS[idx].id] || 0) * D2R;
    animateRoll(ROLL_SIGN * theta + adj, dur);
  }catch(e){ console.warn('[ekko] orientation impossible :', e); }
}

let selTimer = null;
function selectInEngine(idx, delayMs){
  if(!STEL) return;
  clearTimeout(selTimer);
  const iau = IAU[CONSTELLATIONS[idx].id];
  selTimer = setTimeout(() => {
    try{
      if(!iau){ STEL.core.selection = null; return; }
      const obj = STEL.getObj('CON ekko ' + iau) || STEL.getObj('NAME ' + iau);
      STEL.core.selection = obj || null;
    }catch(e){ console.warn('[ekko] sélection impossible :', e); }
  }, delayMs || 0);
}

/* Écoute les clics de l'utilisateur dans le ciel : quand il touche le nom
   (ou le tracé) d'une constellation, le moteur la met en sélection et on
   recale la carte du bas. Un clic sur une étoile ne change rien. */
function watchSelection(stel){
  stel.core.change('selection', () => {
    const sel = stel.core.selection;
    if(!sel) return;
    let desigs;
    try{ desigs = sel.designations(); }catch(e){ return; }
    const con = desigs.find(d => d.indexOf('CON ') === 0);
    if(!con) return;                       /* pas une constellation */
    const idx = BY_IAU[con.split(' ').pop()];
    if(idx === undefined) return;          /* figure hors des 53 d'Ekko */
    if(idx === cardIdx) return;            /* déjà la bonne : rien à faire */
    cardIdx = idx;
    renderCard();
    orientToFigure(idx, 1.0);
  });
}

function goToCard(delta){
  cardIdx = (cardIdx + delta + CONSTELLATIONS.length) % CONSTELLATIONS.length;
  renderCard();
  focusOnCard(1.2);
  orientToFigure(cardIdx, 1.2);
  selectInEngine(cardIdx, 850);   /* le dessin apparaît à l'arrivée du vol */
}
$('#prev').onclick = () => goToCard(-1);

/* ---------- Stellarium ---------- */
let STEL = null;

function focusOnCard(duration){
  if(!STEL) return;
  const c = CONSTELLATIONS[cardIdx], D2R = STEL.D2R;
  let cx=0, cy=0, cz=0;
  const vecs = c.stars.map(s => {
    const v = STEL.s2c(s.ra*15*D2R, s.dec*D2R);
    cx+=v[0]; cy+=v[1]; cz+=v[2];
    return v;
  });
  const n = Math.hypot(cx,cy,cz) || 1;
  const center = [cx/n, cy/n, cz/n];
  let maxAng = 0;
  vecs.forEach(v => {
    const d = Math.max(-1, Math.min(1, v[0]*center[0] + v[1]*center[1] + v[2]*center[2]));
    maxAng = Math.max(maxAng, Math.acos(d));
  });
  const fovDeg = Math.max(26, Math.min(95, (maxAng*STEL.R2D)*2.9 + 12));
  try{
    const observed = STEL.convertFrame(STEL.core.observer, 'ICRF', 'OBSERVED', center);
    const dur = duration === 0 ? 0 : (duration || 1.2);
    STEL.lookAt(observed, dur);
    STEL.zoomTo(fovDeg * D2R, dur);
    pulseReticle();
  }catch(e){ console.warn('[ekko] recentrage impossible :', e); }
}

let reticleTimer;
function pulseReticle(){
  const r = $('#reticle');
  r.classList.remove('on'); void r.offsetWidth; r.classList.add('on');
  clearTimeout(reticleTimer);
  reticleTimer = setTimeout(() => r.classList.remove('on'), 2600);
}

/* Designe le skyculture Ekko comme culture active, puis verifie que les
   figures ont bien ete creees. La designation est rejouee tant que rien
   n'apparait : le JSON et le markdown arrivent de facon asynchrone, et
   reactiver une culture deja active est sans effet de bord — le moteur
   retire les figures existantes avant de les recreer. */
function activateEkkoSkyculture(stel){
  const designate = function(){
    try{ stel.core.skycultures.current_id = 'ekko'; }catch(e){}
  };
  designate();
  let tries = 0;
  const timer = setInterval(function(){
    tries++;
    let ok = false;
    try{ ok = !!stel.getObj('CON ekko UMa'); }catch(e){}
    if(ok){
      clearInterval(timer);
      return;
    }
    if(tries > 40){          /* environ 20 s, puis on abandonne proprement */
      clearInterval(timer);
      console.warn('[ekko] skyculture non active : verifiez /skyculture/ekko/index.json et description.md');
      setStatus('Figures indisponibles - voir la console');
      return;
    }
    designate();
  }, 500);
}

function applyEkkoFilters(stel){
  const core = stel.core;
  const set = fn => { try{ fn(); }catch(e){} };

  /* tracés de constellations + leurs noms (en français, via translateFn) */
  set(()=>{ core.constellations.lines_visible   = true;  });
  set(()=>{ core.constellations.labels_visible  = true;  });
  set(()=>{ core.constellations.images_visible  = false; });
  set(()=>{ core.constellations.bounds_visible  = false; });
  set(()=>{ core.constellations.lines_animation = false; });
  /* Par defaut le moteur n'affiche QUE la figure pointee
     (show_only_pointed = true dans constellations_init). C'est ce reglage,
     et lui seul, qui ne laissait voir qu'une constellation a la fois. */
  set(()=>{ core.constellations.show_only_pointed = false; });
  set(()=>{ core.constellations.lines_color = [0.890, 0.890, 0.769, 0.55]; });

  /* noms d'étoiles, également traduits */
  set(()=>{ core.stars.visible        = true; });
  set(()=>{ core.stars.labels_visible = true; });

  /* Voie lactée : le fond laiteux de Stellarium, servi par un survey HiPS */
  set(()=>{ core.milkyway.visible         = true;  });

  /* Planètes : couleurs issues de planets.ini, phases et anneaux de Saturne
     calculés par le moteur. Le zoom descend jusqu'à 1 seconde d'arc. */
  set(()=>{ core.planets.visible          = true;  });

  /* tout le reste : désactivé */
  set(()=>{ core.atmosphere.visible       = false; });
  set(()=>{ core.landscapes.visible       = false; });
  set(()=>{ core.landscapes.fog_visible   = false; });
  set(()=>{ core.dsos.visible             = false; });
  set(()=>{ core.dss.visible              = false; });
  set(()=>{ core.satellites.visible       = false; });
  set(()=>{ core.comets.visible           = false; });
  set(()=>{ core.minor_planets.visible    = false; });
  set(()=>{ core.lines.azimuthal.visible  = false; });
  set(()=>{ core.lines.equatorial.visible = false; });
  set(()=>{ core.lines.meridian.visible   = false; });
  set(()=>{ core.lines.ecliptic.visible   = false; });
}

function boot(lat, lon){
  GEO.lat = lat; GEO.lon = lon;
  renderCard();
  if(typeof StelWebEngine !== 'function'){
    setStatus('Moteur Stellarium inaccessible — fond de secours affiché');
    return;
  }
  setStatus('Chargement du moteur (WebAssembly)…');
  try{
    StelWebEngine({
      wasmFile: ENGINE_WASM,
      canvas: $('#stel-canvas'),
      translateFn: translateFn,          /* <- noms français dans le canvas */
      onReady: function(stel){
        STEL = stel; window.stel = stel;
        setStatus('Chargement des étoiles et constellations…');

        /* Afacad dans le moteur de texte du canvas */
        Promise.all([
          stel.setFont('regular', AFACAD_TTF),
          stel.setFont('bold', AFACAD_TTF)
        ]).catch(e => console.warn('[ekko] Afacad non chargée dans le moteur :', e));

        stel.core.stars.addDataSource({ url: SKYDATA + 'stars' });
        /* Skyculture Ekko : nos 53 figures et elles seules, noms français
           portés par les données. Absence du bloc « edges » : plus de
           frontières en pointillés.

           Deux subtilités du moteur, relevées dans skycultures.c :
           1. il n'auto-active une culture que si son URL se termine par
              « western ». Pour toute autre, il faut désigner soi-même la
              culture active via current_id ;
           2. l'activation n'a lieu qu'une fois description.md téléchargé,
              et la culture doit déjà être désignée active à cet instant.

           Pour revenir aux 88 figures occidentales :
           stel.core.skycultures.addDataSource({ url: SKYDATA + 'skycultures/western', key: 'western' }); */
        stel.core.skycultures.addDataSource({ url: '/skyculture/ekko', key: 'ekko' });
        activateEkkoSkyculture(stel);
        /* fond de Voie lactée */
        stel.core.milkyway.addDataSource({ url: SKYDATA + 'surveys/milkyway' });
        /* textures de surface : seules la Lune et le Soleil en ont une.
           On n'enregistre volontairement pas de clé « default » : elle
           appliquerait la texture lunaire à toutes les autres planètes.
           Sans elle, chacune garde sa couleur propre et ses anneaux. */
        stel.core.planets.addDataSource({ url: SKYDATA + 'surveys/sso/moon', key: 'moon' });
        stel.core.planets.addDataSource({ url: SKYDATA + 'surveys/sso/sun',  key: 'sun'  });

        applyEkkoFilters(stel);
        watchSelection(stel);
        try{
          stel.core.observer.latitude  = lat * stel.D2R;
          stel.core.observer.longitude = lon * stel.D2R;
          stel.core.observer.elevation = 0;
          stel.core.observer.utc = stel.date2MJD(new Date());
        }catch(e){ console.warn('[ekko] observer :', e); }

        try{ stel.zoomTo(88 * stel.D2R, 0); }catch(e){}
        setTimeout(() => { focusOnCard(1.6); orientToFigure(cardIdx, 1.6); selectInEngine(cardIdx, 1200); }, 1000);
        setTimeout(() => { $('#fallback-stars').style.opacity = '0'; }, 1600);
        hideStatus(2800);
      }
    });
  }catch(e){
    console.error(e);
    setStatus('Échec du moteur — fond de secours affiché');
  }
}

/* Le moteur autorise un champ minimal d'une seconde d'arc. On s'arrête à
   0,005° (18″), largement suffisant pour remplir l'écran avec Jupiter, qui
   fait une cinquantaine de secondes d'arc. Le pas s'affine automatiquement
   en zoom serré, sinon un seul appui ferait sauter plusieurs planètes. */
const FOV_MIN = 0.005, FOV_MAX = 120;
function zoomBy(f){
  if(!STEL) return;
  try{
    const cur = STEL.core.fov * STEL.R2D;
    const k = cur < 0.5 ? Math.pow(f, 0.55) : f;
    STEL.zoomTo(Math.max(FOV_MIN, Math.min(FOV_MAX, cur*k)) * STEL.D2R, 0.35);
  }catch(e){}
}
$('#z-in').onclick  = () => zoomBy(0.72);
$('#z-out').onclick = () => zoomBy(1/0.72);

renderCard();
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(
    p => boot(p.coords.latitude, p.coords.longitude),
    () => boot(GEO.lat, GEO.lon),
    { enableHighAccuracy:false, timeout:6000 }
  );
}else boot(GEO.lat, GEO.lon);
</script>
