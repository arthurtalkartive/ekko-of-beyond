<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ekko — banc d'essai constellation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Afacad:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #E3E3C4;
    --ink-soft: rgba(227, 227, 196, .55);
    --ink-faint: rgba(227, 227, 196, .22);
    --sky-top: #080d14;
    --sky-bottom: #123049;
    --panel: rgba(8, 14, 22, .72);
    --font: 'Afacad', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--sky-top);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  /* Fond provisoire. En production ce sera l'asset du splashscreen. */
  #stage {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(120% 80% at 50% 108%, rgba(32, 92, 132, .55) 0%, transparent 62%),
      linear-gradient(178deg, var(--sky-top) 0%, #0b1723 46%, var(--sky-bottom) 100%);
    overflow: hidden;
  }

  #stage::after {
    /* Champ d'étoiles de substitution, purement décoratif. */
    content: '';
    position: absolute;
    inset: -10%;
    background-image:
      radial-gradient(1.4px 1.4px at 12% 22%, rgba(255,255,255,.55), transparent),
      radial-gradient(1px 1px at 68% 14%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.6px 1.6px at 84% 61%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 34% 74%, rgba(255,255,255,.35), transparent),
      radial-gradient(1.2px 1.2px at 52% 41%, rgba(255,255,255,.3), transparent),
      radial-gradient(1px 1px at 22% 57%, rgba(255,255,255,.32), transparent),
      radial-gradient(1.3px 1.3px at 76% 33%, rgba(255,255,255,.28), transparent),
      radial-gradient(1px 1px at 44% 88%, rgba(255,255,255,.3), transparent);
    background-size: 340px 300px;
    background-repeat: repeat;
    opacity: .7;
    pointer-events: none;
  }

  #viewport {
    position: absolute;
    inset: 88px 380px 132px 40px;
  }

  /* -------------------------------------------------------------- tooltip */

  #tooltip {
    position: absolute;
    width: 268px;
    padding: 16px 18px 18px;
    border: 1px solid var(--ink-faint);
    border-radius: 3px;
    background: rgba(6, 12, 20, .82);
    backdrop-filter: blur(14px);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .38s cubic-bezier(.4,0,.2,1), transform .38s cubic-bezier(.4,0,.2,1);
    pointer-events: none;
  }
  #tooltip[data-visible] { opacity: 1; transform: translateY(0); }
  #tooltip h3 { margin: 0; font-size: 21px; font-weight: 500; letter-spacing: .01em; }
  #tooltip .meta { margin: 3px 0 10px; font-size: 13px; color: var(--ink-soft); }
  #tooltip p { margin: 0; font-size: 14px; line-height: 1.5; color: rgba(227,227,196,.78); }
  #tooltip .rule { height: 1px; margin: 12px 0; background: var(--ink-faint); }

  /* ---------------------------------------------------------------- panel */

  #panel {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 340px;
    padding: 24px 24px 40px;
    overflow-y: auto;
    background: var(--panel);
    backdrop-filter: blur(18px);
    border-left: 1px solid var(--ink-faint);
  }

  #panel h1 {
    margin: 0 0 2px;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: .02em;
  }
  #panel .sub { margin: 0 0 22px; font-size: 13px; color: var(--ink-soft); }

  fieldset {
    margin: 0 0 20px;
    padding: 0;
    border: 0;
    border-top: 1px solid var(--ink-faint);
    padding-top: 14px;
  }
  legend { padding: 0 8px 0 0; font-size: 12px; color: var(--ink-soft); }

  label.row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    gap: 4px 10px;
    margin-bottom: 11px;
    font-size: 13.5px;
  }
  label.row .val { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 12.5px; }
  label.row input, label.row select { grid-column: 1 / -1; }

  input[type=range] {
    width: 100%;
    height: 18px;
    margin: 2px 0 0;
    appearance: none;
    background: transparent;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 1px; background: var(--ink-faint);
  }
  input[type=range]::-webkit-slider-thumb {
    appearance: none;
    width: 11px; height: 11px;
    margin-top: -5px;
    border-radius: 50%;
    background: var(--ink);
  }
  input[type=range]::-moz-range-track { height: 1px; background: var(--ink-faint); }
  input[type=range]::-moz-range-thumb {
    width: 11px; height: 11px; border: 0; border-radius: 50%; background: var(--ink);
  }

  select {
    width: 100%;
    padding: 7px 9px;
    color: var(--ink);
    background: rgba(255,255,255,.05);
    border: 1px solid var(--ink-faint);
    border-radius: 2px;
    font-family: inherit;
    font-size: 14px;
  }
  select option { background: #0b1420; }

  #starlist {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 210px;
    overflow-y: auto;
  }
  #starlist button {
    padding: 5px 9px;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid var(--ink-faint);
    border-radius: 2px;
    font-family: inherit;
    font-size: 12.5px;
    cursor: pointer;
    transition: color .18s, border-color .18s, background .18s;
  }
  #starlist button:hover { color: var(--ink); border-color: var(--ink-soft); }
  #starlist button[aria-pressed=true] {
    color: #0b1420;
    background: var(--ink);
    border-color: var(--ink);
  }
  #starlist button:focus-visible,
  select:focus-visible,
  input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  #readout {
    margin-top: 6px;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  /* -------------------------------------------------------------- loader */

  #loader {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 14px;
    justify-items: center;
    padding: 40px;
    text-align: center;
    background: var(--sky-top);
    z-index: 10;
  }
  #loader p { max-width: 34ch; margin: 0; line-height: 1.55; color: var(--ink-soft); }
  #loader code { color: var(--ink); }
  #loader input[type=file] { color: var(--ink-soft); font-family: inherit; font-size: 13px; }
  #loader[hidden] { display: none; }
</style>
</head>
<body>

<div id="stage">
  <div id="viewport"></div>
  <div id="tooltip" role="note"></div>
</div>

<aside id="panel">
  <h1>Banc d'essai constellation</h1>
  <p class="sub">Réglage du rendu SVG avant intégration dans le player.</p>

  <fieldset>
    <legend>Figure</legend>
    <label class="row"><span>Constellation</span><select id="figure"></select></label>
    <label class="row"><span>Roulis</span><span class="val" id="rollVal">0°</span>
      <input id="roll" type="range" min="-180" max="180" step="1" value="0"></label>
    <label class="row"><span>Projection</span><select id="projection">
      <option value="stereographic">Stéréographique</option>
      <option value="gnomonic">Gnomonique</option>
    </select></label>
    <label class="row"><span>Marge</span><span class="val" id="padVal">64 px</span>
      <input id="padding" type="range" min="0" max="200" step="4" value="64"></label>
    <div id="readout"></div>
  </fieldset>

  <fieldset>
    <legend>Étoiles</legend>
    <label class="row"><span>Rayon min</span><span class="val" id="rMinVal">1.1</span>
      <input id="rMin" type="range" min="0.4" max="4" step="0.1" value="1.1"></label>
    <label class="row"><span>Rayon max</span><span class="val" id="rMaxVal">6.0</span>
      <input id="rMax" type="range" min="2" max="16" step="0.2" value="6"></label>
    <label class="row"><span>Contraste (gamma)</span><span class="val" id="gammaVal">2.2</span>
      <input id="gamma" type="range" min="1" max="4" step="0.1" value="2.2"></label>
    <label class="row"><span>Saturation B-V</span><span class="val" id="satVal">0.35</span>
      <input id="sat" type="range" min="0" max="1" step="0.05" value="0.35"></label>
    <label class="row"><span>Halo</span><span class="val" id="glowVal">4.2×</span>
      <input id="glow" type="range" min="1.5" max="10" step="0.2" value="4.2"></label>
  </fieldset>

  <fieldset>
    <legend>Tracés</legend>
    <label class="row"><span>Opacité</span><span class="val" id="lineOpVal">0.42</span>
      <input id="lineOp" type="range" min="0" max="1" step="0.02" value="0.42"></label>
    <label class="row"><span>Épaisseur</span><span class="val" id="lineWVal">1.0</span>
      <input id="lineW" type="range" min="0.5" max="3" step="0.1" value="1"></label>
  </fieldset>

  <fieldset>
    <legend>Mise en avant</legend>
    <label class="row"><span>Étoiles éteintes</span><span class="val" id="dimVal">0.20</span>
      <input id="dim" type="range" min="0" max="1" step="0.02" value="0.2"></label>
    <label class="row"><span>Tracés éteints</span><span class="val" id="dimLVal">0.45</span>
      <input id="dimL" type="range" min="0" max="1" step="0.02" value="0.45"></label>
    <label class="row"><span>Grossissement</span><span class="val" id="popVal">1.35</span>
      <input id="pop" type="range" min="1" max="2.5" step="0.05" value="1.35"></label>
    <label class="row"><span>Durée de transition</span><span class="val" id="durVal">480 ms</span>
      <input id="dur" type="range" min="80" max="1200" step="20" value="480"></label>
    <div id="starlist"></div>
  </fieldset>
</aside>

<div id="loader">
  <p>Le banc d'essai charge <code>data/ekko-sky.json</code>. En <code>file://</code> le
     navigateur bloque la requête — choisis le fichier à la main, ou sers le dossier
     avec <code>npx serve</code>.</p>
  <input id="filePick" type="file" accept="application/json,.json">
</div>

<script type="module">
import { ConstellationView } from './js/constellation-view.js';

const $ = (id) => document.getElementById(id);
const viewport = $('viewport');
const tooltip = $('tooltip');
const loader = $('loader');

let view = null;
let current = null;   // hip mis en avant

/* --------------------------------------------------------------- amorçage */

boot();

async function boot() {
  let data = null;
  try {
    const r = await fetch('data/ekko-sky.json');
    if (r.ok) data = await r.json();
  } catch { /* file:// — on bascule sur le sélecteur */ }

  if (data) return start(data);

  $('filePick').addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    start(JSON.parse(await file.text()));
  });
}

function start(data) {
  loader.hidden = true;
  view = new ConstellationView(viewport, { data, ...readOptions() });

  const select = $('figure');
  const entries = Object.entries(data.figures)
    .sort((a, b) => a[1].name.localeCompare(b[1].name, 'fr'));
  for (const [iau, fig] of entries) {
    select.append(new Option(`${fig.name} · ${iau}`, iau));
  }
  select.value = data.figures.Ori ? 'Ori' : entries[0][0];

  wire();
  showFigure(select.value);
}

/* ----------------------------------------------------------------- options */

function readOptions() {
  return {
    padding: +$('padding').value,
    roll: +$('roll').value,
    projection: $('projection').value,
    dim: +$('dim').value,
    dimLines: +$('dimL').value,
    focusScale: +$('pop').value,
    glowScale: +$('glow').value,
    lineOpacity: +$('lineOp').value,
    lineWidth: +$('lineW').value,
    transitionMs: +$('dur').value,
    star: { rMin: +$('rMin').value, rMax: +$('rMax').value, gamma: +$('gamma').value },
    color: { saturation: +$('sat').value },
  };
}

const LABELS = {
  roll: (v) => `${v}°`, padding: (v) => `${v} px`, dur: (v) => `${v} ms`,
  glow: (v) => `${(+v).toFixed(1)}×`,
};

function wire() {
  const ids = ['padding', 'roll', 'projection', 'dim', 'dimL', 'pop', 'glow',
    'lineOp', 'lineW', 'dur', 'rMin', 'rMax', 'gamma', 'sat'];

  for (const id of ids) {
    const input = $(id);
    input.addEventListener('input', () => {
      const out = $(`${id}Val`);
      if (out) out.textContent = (LABELS[id] ?? ((v) => (+v).toFixed(2)))(input.value);
      view.setOptions(readOptions());
      // La transition CSS est régénérée à chaque repeint : on réapplique le focus.
      if (current !== null) view.focus(current);
      placeTooltip();
      updateReadout();
    });
  }

  $('figure').addEventListener('change', (e) => showFigure(e.target.value));
  window.addEventListener('resize', () => requestAnimationFrame(placeTooltip));
}

/* ------------------------------------------------------------------ figure */

function showFigure(iau) {
  view.setFigure(iau);
  current = null;
  hideTooltip();
  buildStarList();
  updateReadout();
}

function buildStarList() {
  const list = $('starlist');
  list.replaceChildren();
  for (const s of view.listStars()) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = s.name ?? `HIP ${s.hip}`;
    b.title = `HIP ${s.hip} · mag ${s.mag.toFixed(2)}`;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => toggleStar(s.hip));
    b.dataset.hip = s.hip;
    list.append(b);
  }
}

function toggleStar(hip) {
  const next = current === hip ? null : hip;
  current = next;

  for (const b of $('starlist').children) {
    b.setAttribute('aria-pressed', String(+b.dataset.hip === next));
  }

  if (next === null) { view.clearFocus(); hideTooltip(); return; }
  view.focus(next);
  showTooltip(next);
}

/* ----------------------------------------------------------------- tooltip */

function showTooltip(hip) {
  const s = view.listStars().find((p) => p.hip === hip);
  const raw = view.data.stars[hip];
  tooltip.innerHTML = '';

  const h = document.createElement('h3');
  h.textContent = s.name ?? `HIP ${s.hip}`;
  const meta = document.createElement('p');
  meta.className = 'meta';
  meta.textContent = [
    raw.bayer ? `${raw.bayer} ${raw.con ?? ''}`.trim() : null,
    `magnitude ${s.mag.toFixed(2)}`,
  ].filter(Boolean).join(' · ');
  const rule = document.createElement('div');
  rule.className = 'rule';
  const body = document.createElement('p');
  body.textContent = 'Emplacement du contenu rédigé dans le Studio : texte, image, '
    + 'chiffre clé. Ce bloc n\'est là que pour valider l\'ancrage et le placement.';

  tooltip.append(h, meta, rule, body);
  tooltip.setAttribute('data-visible', '');
  placeTooltip();
}

function hideTooltip() { tooltip.removeAttribute('data-visible'); }

/**
 * Ancrage de l'info-bulle sur l'étoile, avec bascule automatique quand on
 * approche d'un bord. C'est cette logique qui sera reprise dans le player.
 */
function placeTooltip() {
  if (current === null || !tooltip.hasAttribute('data-visible')) return;
  const p = view.getStarPoint(current);
  if (!p) return;

  const vp = viewport.getBoundingClientRect();
  const stage = document.getElementById('stage').getBoundingClientRect();
  const w = tooltip.offsetWidth;
  const h = tooltip.offsetHeight;
  const gap = 18 + p.r;

  // Origine de l'étoile, dans le repère du stage.
  const sx = vp.left - stage.left + p.x;
  const sy = vp.top - stage.top + p.y;

  const flipX = sx + gap + w > stage.width - 380 - 16;
  const flipY = sy + gap + h > stage.height - 16;

  tooltip.style.left = `${Math.max(16, flipX ? sx - gap - w : sx + gap)}px`;
  tooltip.style.top = `${Math.max(16, flipY ? sy - gap - h : sy + gap)}px`;
}

/* ----------------------------------------------------------------- lecture */

function updateReadout() {
  const fig = view.figure;
  const l = view.layout;
  $('readout').textContent =
    `${fig.name} — ${l.stars.length} étoiles, ${l.segments.length} segments · `
    + `rayon ${fig.radius.toFixed(1)}° · centre ${fig.center.ra.toFixed(1)}° / `
    + `${fig.center.dec >= 0 ? '+' : ''}${fig.center.dec.toFixed(1)}°`;
}
</script>
</body>
</html>
