<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="128x128" href="/favicon-128x128.png">
<link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#060A10">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ekko of Beyond">
<meta property="og:title" content="Ekko of Beyond · Ma progression">
<meta property="og:description" content="A new journey amongst the stars.">
<meta property="og:image" content="https://ekko-of-beyond.vercel.app/assets/img/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Ekko of Beyond · Ma progression">
<meta name="twitter:description" content="A new journey amongst the stars.">
<meta name="twitter:image" content="https://ekko-of-beyond.vercel.app/assets/img/og-image.png">
<title>Ekko of Beyond · Ma progression</title>
<link rel="preload" as="image" href="/assets/img/splash-background.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#E3E3C4; --c50:rgba(227,227,196,.5); --c20:rgba(227,227,196,.2);
  --ink:#060A10;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Afacad',system-ui,sans-serif;color:var(--cream);background:#04070B;min-height:100vh}
button{font-family:inherit;color:inherit}
a{color:inherit}
img{max-width:100%;display:block}

/* Fond de page : le meme ciel etoile que le splash, assombri pour que le
   texte reste lisible — le meme traitement que la fiche constellation. */
#pagebg{position:fixed;inset:0;z-index:0;pointer-events:none}
#pagebg img{width:100%;height:100%;object-fit:cover;object-position:center bottom;
  opacity:0;transition:opacity .6s ease}
#pagebg img.ready{opacity:1}
#pagebg .ov{position:absolute;inset:0;background:rgba(0,0,0,.55)}

/* ---------- en-tete ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;
  padding:calc(14px + var(--st)) 26px 14px;
  background:linear-gradient(180deg,rgba(3,6,10,.96),rgba(3,6,10,.62));
  border-bottom:1px solid var(--c20);backdrop-filter:blur(12px)}
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  border:1px solid var(--c50);border-radius:999px;padding:9px 16px;font-size:11.5px;
  font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.8;
  transition:opacity .2s,background .2s;white-space:nowrap}
.back:hover{opacity:1;background:rgba(227,227,196,.08)}
.top .sp{flex:1}
.top .where{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.45;white-space:nowrap}

/* ---------- contenu ---------- */
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:48px 26px calc(80px + var(--sb));
  display:flex;flex-direction:column;align-items:center;text-align:center}

/* ---------- anneau ---------- */
.ring-zone{position:relative;width:min(340px,74vw);height:min(340px,74vw);flex:none;margin-top:8px}
.ring-zone svg{width:100%;height:100%;overflow:visible}
.ring-deco{transform-origin:170px 170px;animation:ring-spin 34s linear infinite}
@keyframes ring-spin{to{transform:rotate(360deg)}}
#ring-fill{transition:stroke-dashoffset 1s cubic-bezier(.3,.8,.3,1)}
.ring-center{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
}
.ring-ico{width:38px;height:38px;flex:none;opacity:.92}
.ring-ico img{width:100%;height:100%;object-fit:contain;display:block}
.ring-count{display:flex;align-items:baseline;gap:4px;line-height:1}
.ring-count .n{font-size:clamp(40px,11vw,56px);font-weight:700}
.ring-count .slash{font-size:20px;opacity:.4;font-weight:700}
.ring-count .total{font-size:20px;opacity:.55;font-weight:700}
.ring-level{font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-top:2px}

.tagline{margin-top:26px;font-size:16px;font-style:italic;color:var(--c50);max-width:36ch;line-height:1.4}

/* ---------- echelle des niveaux ---------- */
.ladder{list-style:none;width:100%;margin-top:46px;display:flex;flex-direction:column;gap:2px;text-align:left}
.ladder-hd{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--c50);
  margin-bottom:14px;align-self:flex-start}
.lrow{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid rgba(227,227,196,.1)}
.lrow:last-child{border-bottom:none}
.lrow .lico{width:26px;height:26px;flex:none;opacity:.35}
.lrow .lico img{width:100%;height:100%;object-fit:contain;display:block}
.lrow.done .lico,.lrow.now .lico{opacity:1}
.lrow-mid{flex:1 1 0;min-width:0}
.lrow-name{font-size:14.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--c50)}
.lrow.done .lrow-name,.lrow.now .lrow-name{color:var(--cream)}
.lrow-bar{margin-top:6px;height:3px;border-radius:2px;background:var(--c20);overflow:hidden;display:none}
.lrow.now .lrow-bar{display:block}
.lrow-bar span{display:block;height:100%;background:var(--cream);border-radius:2px}
.lrow-status{flex:none;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c50);
  text-align:right;white-space:nowrap}
.lrow.done .lrow-status{color:var(--cream)}
.lrow.now .lrow-status{color:var(--cream)}

@media (max-width:520px){
  .wrap{padding:36px 20px calc(70px + var(--sb))}
  .ring-zone{width:min(300px,80vw);height:min(300px,80vw)}
  .lrow-name{font-size:13.5px}
  .lrow-status{font-size:10px}
}
@media (prefers-reduced-motion:reduce){ .ring-deco{animation:none} }
</style>
</head>
<body>

<div id="pagebg"><img src="/assets/img/splash-background.webp" alt="" decoding="async"><div class="ov"></div></div>

<div class="top">
  <a class="back" href="/">&larr;&nbsp; Vue du ciel</a>
  <span class="sp"></span>
  <span class="where">Ma progression</span>
</div>

<main class="wrap">
  <div class="ring-zone">
    <svg viewBox="0 0 340 340" aria-hidden="true">
      <g class="ring-deco">
        <circle cx="170" cy="170" r="160" fill="none" stroke="rgba(227,227,196,.45)" stroke-width="1.2" stroke-dasharray="2.5 8"/>
      </g>
      <circle cx="170" cy="170" r="136" fill="none" stroke="rgba(227,227,196,.12)" stroke-width="13"/>
      <circle id="ring-fill" cx="170" cy="170" r="136" fill="none" stroke="#E3E3C4" stroke-width="13"
        stroke-linecap="round" transform="rotate(-90 170 170)"/>
      <g id="ring-ticks"></g>
      <g id="ring-cursor"></g>
    </svg>
    <div class="ring-center">
      <span class="ring-ico"><img id="lvl-ico" src="" alt=""></span>
      <div class="ring-count"><span class="n" id="ring-n">0</span><span class="slash">/</span><span class="total" id="ring-total">53</span></div>
      <div class="ring-level" id="ring-level">—</div>
    </div>
  </div>

  <p class="tagline" id="tagline"></p>

  <ul class="ladder" id="ladder">
    <span class="ladder-hd">Les huit niveaux</span>
  </ul>
</main>

<script>
const $ = (id) => document.getElementById(id);

/* Fond pret des que decode() resout — evite le flash blanc au chargement. */
(function(){
  const img = document.querySelector('#pagebg img');
  const show = () => img.classList.add('ready');
  if(img.complete) show(); else { img.addEventListener('load', show); img.decode?.().then(show).catch(()=>{}); }
})();

/* ============================================================
   NIVEAUX — copie de la meme table que index.html (const LEVELS).
   Les deux doivent rester identiques ; le fichier n'a pas de mecanisme
   de partage de module, seule la duplication est possible ici. Si les
   noms ou seuils changent d'un cote, reporter le changement de l'autre.
   ============================================================ */
const LEVELS = [
  { slug:'level-0', name:'Œil Nu',                   min:0,    tagline:"Le ciel n'a encore rien murmuré." },
  { slug:'level-1', name:'Éveillé aux Étoiles',       min:0.01, tagline:'Les premiers échos se font entendre.' },
  { slug:'level-2', name:"Chercheur d'Échos",         min:0.10, tagline:'Chaque constellation devient une piste à suivre.' },
  { slug:'level-3', name:'Cartographe du Ciel',       min:0.25, tagline:'Le ciel commence à prendre forme.' },
  { slug:'level-4', name:'Gardien des Constellations',min:0.45, tagline:'Une bonne moitié du ciel nocturne vous appartient.' },
  { slug:'level-5', name:'Oracle Céleste',            min:0.68, tagline:'Peu de figures célestes vous échappent encore.' },
  { slug:'level-6', name:'Souverain des Astres',      min:0.87, tagline:'Le ciel vous appartient presque tout entier.' },
  { slug:'level-7', name:"Écho de l'Au-delà",         min:1.00, tagline:'Chaque Ekko a résonné. Le ciel entier vous répond.' },
];
const LEVEL_ICON_FALLBACK = '/assets/img/levels/_fallback.svg';
function levelIconUrl(level){ return '/assets/img/levels/' + level.slug + '.svg'; }
function setIconWithFallback(imgEl, level){
  imgEl.onerror = function(){ imgEl.onerror = null; imgEl.src = LEVEL_ICON_FALLBACK; };
  imgEl.src = levelIconUrl(level);
}

/* Meme cle que index.html (PROGRESS_KEY / LEVEL_KEY) : c'est le meme
   compte, on ne fait que le lire ici. Le total est ecrit par index.html
   a chaque chargement (voir CONSTELLATIONS juste apres sa definition) ;
   53 en repli pour quelqu'un qui arriverait directement sur cette page. */
function loadCollectedCount(){
  try{
    const raw = localStorage.getItem('ekko-collected');
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr.length : 0;
  }catch(e){ return 0; }
}
function loadTotal(){
  const v = parseInt(localStorage.getItem('ekko-total'), 10);
  return (v && v > 0) ? v : 53;
}
function levelIndexForRatio(ratio){
  let idx = 0;
  for(let i = 0; i < LEVELS.length; i++){ if(ratio >= LEVELS[i].min) idx = i; }
  return idx;
}
function currentLevelIndex(total, n){
  const computed = levelIndexForRatio(n / total);
  let best = 0;
  try{ best = parseInt(localStorage.getItem('ekko-level-best'), 10) || 0; }catch(e){}
  const idx = Math.max(best, computed, 0);
  try{ localStorage.setItem('ekko-level-best', String(idx)); }catch(e){}
  return idx;
}

const TOTAL = loadTotal();
const N = loadCollectedCount();
const IDX = currentLevelIndex(TOTAL, N);
const LEVEL = LEVELS[IDX];
const RATIO = Math.min(1, N / TOTAL);

/* ---------- anneau ---------- */
const R = 136, CX = 170, CY = 170;
const CIRC = 2 * Math.PI * R;
const fillEl = $('ring-fill');
fillEl.setAttribute('stroke-dasharray', CIRC.toFixed(2));
requestAnimationFrame(function(){
  fillEl.setAttribute('stroke-dashoffset', (CIRC * (1 - RATIO)).toFixed(2));
});

function pt(fraction, radius){
  const a = (-90 + 360 * fraction) * Math.PI / 180;
  return { x: CX + radius * Math.cos(a), y: CY + radius * Math.sin(a) };
}

/* Un repere sur l'anneau pour chaque niveau, allume des qu'il est atteint —
   le meme langage visuel que les autres pastilles ● / cercles ○ de l'app. */
const ticksSvg = LEVELS.map(function(lv){
  const p = pt(lv.min, R);
  const reached = RATIO >= lv.min;
  return '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + (reached ? 4.5 : 3.5) + '"'
    + ' fill="' + (reached ? '#E3E3C4' : '#04070B') + '" stroke="' + (reached ? '#04070B' : 'rgba(227,227,196,.45)') + '"'
    + ' stroke-width="' + (reached ? 2 : 1.2) + '"/>';
}).join('');
$('ring-ticks').innerHTML = ticksSvg;

/* Le curseur : point vif exactement a la position actuelle sur l'anneau —
   le meme duo pastille pleine + anneau fin que partout ailleurs dans
   l'app (voir .d5/.r7). */
const cur = pt(RATIO, R);
$('ring-cursor').innerHTML =
  '<circle cx="' + cur.x.toFixed(1) + '" cy="' + cur.y.toFixed(1) + '" r="9" fill="none" stroke="#E3E3C4" stroke-width="1.2"/>'
  + '<circle cx="' + cur.x.toFixed(1) + '" cy="' + cur.y.toFixed(1) + '" r="4" fill="#E3E3C4"/>';

/* ---------- centre ---------- */
setIconWithFallback($('lvl-ico'), LEVEL);
$('ring-n').textContent = N;
$('ring-total').textContent = TOTAL;
$('ring-level').textContent = LEVEL.name;
$('tagline').textContent = LEVEL.tagline;

/* ---------- echelle ---------- */
const ladder = $('ladder');
LEVELS.forEach(function(lv, i){
  const threshold = Math.max(i === 0 ? 0 : 1, Math.ceil(lv.min * TOTAL));
  const li = document.createElement('li');
  li.className = 'lrow' + (i < IDX ? ' done' : i === IDX ? ' now' : '');
  let status;
  if(i < IDX) status = 'Atteint';
  else if(i === IDX) status = (i === LEVELS.length - 1) ? 'Niveau actuel' : (N + ' / ' + Math.ceil((LEVELS[i+1]||{min:1}).min * TOTAL));
  else status = 'Dès ' + threshold + ' Ekko';

  let bar = '';
  if(i === IDX && i < LEVELS.length - 1){
    const next = LEVELS[i + 1];
    const span = (next.min - lv.min) || 1;
    const pct = Math.max(2, Math.min(100, Math.round(((RATIO - lv.min) / span) * 100)));
    bar = '<div class="lrow-bar"><span style="width:' + pct + '%"></span></div>';
  }

  li.innerHTML =
    '<span class="lico"><img alt="" data-slug="' + lv.slug + '"></span>' +
    '<div class="lrow-mid"><div class="lrow-name">' + lv.name + '</div>' + bar + '</div>' +
    '<div class="lrow-status">' + status + '</div>';
  ladder.appendChild(li);
  setIconWithFallback(li.querySelector('img'), lv);
});
</script>
</body>
</html>
