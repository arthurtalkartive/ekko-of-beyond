<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="128x128" href="/favicon-128x128.png">
<link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#060A10">

<title>Ekko of Beyond — écoute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Afacad:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #E3E3C4;
    --gold-50: rgba(227, 227, 196, .5);
    --gold-42: rgba(227, 227, 196, .42);
    --gold-20: rgba(227, 227, 196, .2);
    --font: 'Afacad', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --pad-x: clamp(20px, 5.5vw, 80px);
    --ctl: 1;                       /* échelle du cluster de contrôles */
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%; margin: 0; overflow: hidden;
    background: #000;
    color: var(--gold);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    /* Un appui repete sur ±10s (ou n'importe quel bouton) etait par moments
       interprete comme un double-tap par le navigateur, qui zoomait la
       page — "manipulation" garde le defilement/pincement normal mais
       supprime specifiquement ce zoom au double-tap. */
    touch-action: manipulation;
  }

  button { font-family: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  /* Sans ça, `#account` étant une balise <a>, le navigateur lui applique ses
     couleurs de lien et de lien visité — d'où le violet après une visite. */
  a, a:visited, a:hover, a:active { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  /* ============================================================== décor */

  /* Le fond, c'est l'image du splashscreen et rien d'autre.
     Le dégradé en dessous ne sert que de couleur d'attente pendant le
     chargement et de repli si l'image manque : dès qu'elle est peinte en
     `cover`, elle le recouvre entièrement.

     Il n'y a volontairement AUCUNE couche par-dessus. J'avais reproduit
     l'ellipse d'horizon de la maquette en `mix-blend-mode: color-dodge`,
     sans voir que splash-background.webp contient déjà sa propre lueur : le
     color-dodge saturait l'image vers le vert et dessinait en plus le bord
     arrondi de l'ellipse en travers de l'écran. */
  #sky {
    position: fixed; inset: 0;
    background:
      url('assets/img/splash-background.webp') center / cover no-repeat,
      linear-gradient(180deg, #000 0%, #0A1931 100%);
  }

  #shell {
    position: fixed; inset: 0;
    opacity: 0;
    transition: opacity .48s cubic-bezier(0, 0, .2, 1);
  }
  #shell[data-in] { opacity: 1; }

  /* Rideau de fondu. Rien d'autre que l'opacité n'est animé. */
  #curtain {
    position: fixed; inset: 0; z-index: 90;
    background: #000;
    opacity: 1; pointer-events: none;
    will-change: opacity;
    transition: opacity .48s cubic-bezier(0, 0, .2, 1);
  }
  #curtain[data-open] { opacity: 0; }
  #curtain[data-closing] { opacity: 1; transition-duration: .32s; transition-timing-function: cubic-bezier(.4, 0, 1, 1); }

  /* ============================================================= header */

  #header {
    position: absolute; left: 0; right: 0; top: 0; height: 89px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 var(--pad-x);
    z-index: 20;
  }

  .pill {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 32px;
    border: 1px solid var(--gold); border-radius: 999px;
    font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: .01em;
    white-space: nowrap;
    transition: background .2s;
  }
  .pill:hover { background: rgba(227, 227, 196, .1); }

  #account {
    display: flex; align-items: center; gap: 15px;
    color: var(--gold);
    font-size: 18px; font-weight: 700; text-transform: uppercase;
    white-space: nowrap;
    transition: opacity .2s;
  }
  #account:hover { opacity: .72; }
  #account svg { flex: none; }

  /* Panneau de la défonce. Sa largeur est pilotée par PlayerHeader. */
  #panel {
    position: absolute; left: 50%; top: -1px;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px;
    text-align: center;
    pointer-events: none;
  }
  #badge {
    padding: 2px 10px;
    background: rgba(255, 255, 255, .3); border-radius: 999px;
    color: #fff; font-size: 10px; font-weight: 700; line-height: 1.5;
    text-transform: uppercase; white-space: nowrap;
  }
  #title {
    font-size: 38px; font-weight: 700; line-height: 1.02;
    text-transform: uppercase; white-space: nowrap;
  }
  #status {
    opacity: .5;
    font-size: 16px; font-weight: 700; text-transform: uppercase; white-space: nowrap;
  }

  /* ============================================================= centre */

  #middle { position: absolute; left: 0; right: 0; top: 186px; bottom: 138px; }
  #viewport { position: absolute; inset: 0; }

  #card {
    position: absolute; z-index: 30;
    width: 300px; max-width: calc(100vw - 40px);
    padding: 18px 20px 20px;
    border: 1px solid var(--gold-20); border-radius: 3px;
    background: rgba(4, 10, 18, .84);
    backdrop-filter: blur(16px);
    opacity: 0; transform: translateY(8px);
    pointer-events: none;
    transition: opacity .42s cubic-bezier(.4, 0, .2, 1), transform .42s cubic-bezier(.4, 0, .2, 1);
  }
  #card[data-visible] { opacity: 1; transform: translateY(0); }
  #card h2 {
    margin: 0; font-size: 24px; font-weight: 700; line-height: 1.1; text-transform: uppercase;
  }
  #card .sub { margin: 4px 0 0; font-size: 13px; font-weight: 500; opacity: .55; text-transform: uppercase; }
  #card .rule { height: 1px; margin: 13px 0; background: var(--gold-20); }
  #card p.body { margin: 0; font-size: 14.5px; line-height: 1.55; color: rgba(227, 227, 196, .8); }
  #card img {
    display: block; width: 100%; margin: 0 0 13px;
    border-radius: 2px; aspect-ratio: 16 / 10; object-fit: cover;
  }

  /* ================================================== bas de l'écran */

  #bottom {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center;
    padding: 0 var(--pad-x) 20px;
    z-index: 20;
  }

  #bar { width: 100%; display: flex; flex-direction: column; gap: 12px; }

  /* Cotes du nœud Figma 215:2870 : extrémités de 36 px, barre de 8 px
     d'épaisseur, crème plein pour la partie écoutée et crème à 20 % pour le
     reste. C'est ce trait de 8 px que j'avais rendu en 1 px. */
  #track {
    position: relative; height: 22px;
    display: flex; align-items: center;
    cursor: pointer; touch-action: none;
  }
  .cap { flex: none; display: block; width: 36px; height: 8px; line-height: 0; }

  #rail { position: relative; flex: 1; height: 22px; }
  #trackline {
    position: absolute; left: 0; right: 0; top: 50%;
    height: 8px; margin-top: -4px;
    background: var(--gold); opacity: .2;
  }
  #elapsed {
    position: absolute; left: 0; top: 50%; width: 0;
    height: 8px; margin-top: -4px;
    background: var(--gold);
  }
  #head {
    position: absolute; top: 50%; width: 2px; height: 18px; margin: -9px 0 0 -1px;
    background: #fff; opacity: 0; transition: opacity .2s;
  }
  #track:hover #head, #track[data-scrub] #head { opacity: .85; }

  .glyph {
    position: absolute; top: 50%;
    width: 16.884px; height: 16.884px; margin: -8.442px 0 0 -8.442px;
    padding: 0; line-height: 0;
    transition: transform .2s, filter .2s;
  }
  .glyph:hover { transform: scale(1.16); }
  .glyph[data-active] {
    transform: scale(1.22);
    filter: drop-shadow(0 0 6px rgba(227, 227, 196, .8));
  }

  #times {
    display: flex; justify-content: space-between;
    font-size: 14px; font-weight: 700; text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }

  /* ------------------------------------------------------- contrôles */

  #controls {
    display: flex; align-items: center; margin-top: 2px;
    zoom: var(--ctl);
  }
  .rule40 { flex: none; width: 40px; height: 1px; background: var(--gold-42); }

  .circle {
    flex: none; display: grid; place-items: center;
    border: 1px solid var(--gold); border-radius: 50%;
    transition: background .2s, opacity .2s;
  }
  .circle:hover:not(:disabled) { background: rgba(227, 227, 196, .1); }
  .circle:disabled { opacity: .3; cursor: not-allowed; }
  .c50 { width: 50px; height: 50px; }
  .c80 { width: 80px; height: 80px; border-width: 1.6px; }
  #play svg { margin-left: 3px; }        /* recentrage optique du triangle */
  #stopSquare { width: 24px; height: 24px; background: var(--gold); }

  /* ---------------------------------------------------------- dialogue */

  #confirm {
    position: fixed; inset: 0; z-index: 80;
    display: grid; place-items: center;
    padding: 24px;
    background: rgba(2, 6, 12, .72);
    backdrop-filter: blur(10px);
    opacity: 0; pointer-events: none;
    transition: opacity .28s;
  }
  #confirm[data-open] { opacity: 1; pointer-events: auto; }
  #confirm .box {
    width: 100%; max-width: 420px; padding: 28px;
    border: 1px solid var(--gold-20); border-radius: 3px;
    background: rgba(6, 12, 20, .96);
    text-align: center;
  }
  #confirm h2 { margin: 0 0 10px; font-size: 22px; font-weight: 700; text-transform: uppercase; }
  #confirm p { margin: 0 0 22px; font-size: 15px; line-height: 1.55; color: rgba(227, 227, 196, .75); }
  #confirm .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #confirm button {
    padding: 12px; border: 1px solid var(--gold-50); border-radius: 2px;
    font-size: 14px; font-weight: 700; text-transform: uppercase;
    transition: background .2s, border-color .2s;
  }
  #confirm button:hover { background: rgba(227, 227, 196, .1); border-color: var(--gold); }
  #confirm button[data-primary] { background: rgba(227, 227, 196, .16); border-color: var(--gold); }

  /* ---------------------------------------------------------- célébration */

  #celebrate {
    position: fixed; inset: 0; z-index: 90;
    display: grid; place-items: center;
    padding: 24px;
    background:
      radial-gradient(120% 90% at 50% 15%, rgba(227,227,196,.08), transparent 62%),
      rgba(2, 6, 12, .9);
    backdrop-filter: blur(12px);
    opacity: 0; pointer-events: none;
    transition: opacity .5s ease;
  }
  #celebrate[data-open] { opacity: 1; pointer-events: auto; }
  #celebrate .box {
    width: 100%; max-width: 420px; text-align: center;
    display: flex; flex-direction: column; align-items: center;
  }
  #celebrate .cel-ring {
    width: 78px; height: 78px; border-radius: 50%; flex: none;
    border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px;
    background: radial-gradient(circle, rgba(227,227,196,.14), transparent 70%);
    transform: scale(.4); opacity: 0;
    transition: transform .5s cubic-bezier(.2,1.5,.4,1) .15s, opacity .4s ease .15s;
  }
  #celebrate[data-open] .cel-ring { transform: scale(1); opacity: 1; }
  #celebrate .cel-ring svg { width: 30px; height: 30px; }
  #celebrate .cel-eyebrow {
    font-size: 12px; font-weight: 700; letter-spacing: .18em;
    text-transform: uppercase; color: var(--gold-50);
  }
  #celebrate h2 { margin: 10px 0 0; font-size: clamp(26px, 6vw, 34px); font-weight: 700; text-transform: uppercase; }
  #celebrate p { margin: 14px 0 34px; font-size: 15.5px; line-height: 1.55; color: rgba(227, 227, 196, .75); }
  #celebrate .cel-btn {
    width: 100%; padding: 15px 30px; border-radius: 20000px;
    border: 1px solid var(--gold);
    background: linear-gradient(180deg, rgba(227,227,196,.04), rgba(227,227,196,.2));
    font-size: 16px; font-weight: 700; text-transform: uppercase;
    transition: background .2s;
  }
  #celebrate .cel-btn:hover { background: linear-gradient(180deg, rgba(227,227,196,.08), rgba(227,227,196,.28)); }

  /* ------------------------------------------------------------- notes */

  #notice {
    position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%);
    margin-bottom: 14px; padding: 7px 14px;
    border: 1px solid var(--gold-20); border-radius: 999px;
    background: rgba(4, 10, 18, .8);
    font-size: 12.5px; color: var(--gold-50); white-space: nowrap;
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  #notice[data-show] { opacity: 1; }

  @media (max-width: 900px) {
    :root { --ctl: .82; }
    #middle { top: 176px; bottom: 176px; }
    #card { width: 268px; }
    #account span { display: none; }
    .pill { padding: 10px 20px; font-size: 14px; }
    /* La géométrie de PlayerHeader (js/player-header.js) suppose déjà, à
       partir de 720px, que les deux boutons qui encadrent le titre sont
       réduits à leur icône — c'est ce qui lui permet d'élargir la
       découpe centrale sans se soucier de leur largeur réelle. #account
       tenait cette promesse, #back non : son libellé texte restait
       affiché et se faisait recouvrir par le titre sur les écrans
       étroits. Les deux doivent se replier au même palier. */
    #back span { display: none; }
    .pill { gap: 0; }
  }

  /* En paysage sur téléphone, la hauteur disponible s'effondre : les
     décalages fixes de #middle (pensés pour un écran haut) ne laissaient
     presque plus rien à la vue de constellation — parfois moins de 40px
     de hauteur utile. On raisonne ici sur la hauteur, indépendamment de
     la largeur, pour lui rendre de la place. */
  @media (max-height: 520px) {
    :root { --ctl: .68; }
    #header { height: 60px; }
    #badge { display: none; }
    #status { font-size: 11px; }
    /* 104px = la découpe compacte de PlayerHeader (js/player-header.js,
       SVG_TOTAL_H_COMPACT), plus une petite marge sous le glyphe suspendu.
       Les deux valeurs doivent avancer ensemble. */
    #middle { top: 108px; bottom: 92px; }
    #bottom { padding-bottom: 8px; }
    #bar { gap: 6px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #shell, #curtain, #card { transition-duration: 1ms; }
  }

  /* ================= BLOCAGE PAYSAGE MOBILE =================
     Meme logique que sur les autres pages publiques : le paysage sur
     telephone ne laisse pas assez de hauteur pour une ecoute confortable
     (voir la variante compacte de PlayerHeader ci-dessus, qui reste en
     secours si ce blocage venait a echouer). `max-height` en paysage
     correspond a la largeur reelle de l'appareil, ce qui distingue un
     telephone (quasiment jamais plus de 560px sur le petit cote) d'une
     tablette, jamais bloquee ici. */
  #landscape-lock {
    position: fixed; inset: 0; z-index: 9999;
    display: none; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #000 0%, #0A1931 100%);
    padding: 40px; text-align: center;
  }
  .ll-box { max-width: 360px; }
  .ll-icon {
    width: 60px; height: 60px; color: var(--gold); margin: 0 auto 22px; display: block;
    animation: ll-rotate 2.6s ease-in-out infinite;
  }
  @keyframes ll-rotate { 0%, 15% { transform: rotate(0deg); } 50%, 65% { transform: rotate(-90deg); } 100% { transform: rotate(-90deg); } }
  .ll-title { font-weight: 700; font-size: 19px; text-transform: uppercase; letter-spacing: .05em; color: var(--gold); }
  .ll-sub { margin-top: 10px; font-size: 14.5px; line-height: 1.55; color: var(--gold); opacity: .6; }
  @media (orientation: landscape) and (max-height: 560px) {
    #landscape-lock { display: flex; }
  }
</style>
</head>
<body>

<div id="landscape-lock" aria-hidden="true">
  <div class="ll-box">
    <svg class="ll-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="20" y="7" width="24" height="42" rx="4" stroke="currentColor" stroke-width="2"/>
      <line x1="28" y1="43" x2="36" y2="43" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M49 24a17 17 0 1 0 -5 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M44 30l5 6 6-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="ll-title">Tournez votre téléphone</div>
    <p class="ll-sub">L'écoute est pensée pour le mode portrait sur mobile. Repassez en portrait pour continuer.</p>
  </div>
</div>

<div id="sky"></div>

<div id="shell">
  <header id="header">
    <button class="pill" id="back" type="button"></button>

    <div id="panel" data-header-panel>
      <span id="badge" data-header-badge></span>
      <span id="title" data-header-title></span>
      <span id="status" data-header-status></span>
    </div>

    <a id="account" href="/tools"></a>
  </header>

  <div id="middle">
    <div id="viewport"></div>
    <aside id="card" role="note"></aside>
  </div>

  <div id="bottom">
    <div id="notice"></div>
    <div id="bar">
      <div id="track" role="slider" tabindex="0" aria-label="Progression de l'écoute"
           aria-valuemin="0" aria-valuenow="0">
        <span class="cap" id="capStart"></span>
        <div id="rail">
          <div id="trackline"></div>
          <div id="elapsed"></div>
          <div id="head"></div>
        </div>
        <span class="cap" id="capEnd"></span>
      </div>
      <div id="times"><span id="tNow">00:00</span><span id="tEnd">00:00</span></div>
    </div>

    <div id="controls">
      <button class="circle c50" id="back10" type="button" aria-label="Reculer de 10 secondes"></button>
      <span class="rule40"></span>
      <button class="circle c80" id="play" type="button" aria-label="Lecture"></button>
      <span class="rule40"></span>
      <button class="circle c80" id="stop" type="button" aria-label="Terminer l'écoute">
        <span id="stopSquare"></span>
      </button>
      <span class="rule40"></span>
      <button class="circle c50" id="fwd10" type="button" aria-label="Avancer de 10 secondes"></button>
    </div>
  </div>
</div>

<div id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="box">
    <h2 id="confirmTitle">Terminer l'écoute</h2>
    <p>L'Ekko sera ajouté à ta collection comme si tu avais tout écouté.</p>
    <div class="actions">
      <button type="button" id="confirmNo">Continuer l'écoute</button>
      <button type="button" id="confirmYes" data-primary>Terminer</button>
    </div>
  </div>
</div>

<!-- Ecran de celebration : remplace le fondu direct vers la carte quand
     l'Ekko vient d'etre collecte, pour que le moment soit marque plutot
     que de filer tout de suite vers l'ecran suivant. -->
<div id="celebrate" role="dialog" aria-modal="true" aria-labelledby="celTitle">
  <div class="box">
    <div class="cel-ring">
      <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.5 5.3l2.3 2.3L8.6 2.7"/></svg>
    </div>
    <span class="cel-eyebrow">Ekko collecté</span>
    <h2 id="celTitle"></h2>
    <p id="celSub">a été ajoutée à ta collection.</p>
    <button type="button" class="cel-btn" id="celContinue">Continuer l'aventure</button>
  </div>
</div>

<div id="curtain"></div>

<script type="module">
import { ConstellationView } from './js/constellation-view.js';
import { toViewOptions, emptySettings } from './js/view-settings.js';
import { CueEngine, Chime, emptyTrack } from './js/cue-engine.js';
import { ICONS, CUE_GLYPH, LINE_START, LINE_END } from './js/ekko-icons.js';
import { PlayerHeader } from './js/player-header.js';
import { requireAuth } from '/js/supa.js';

/* Il faut un compte pour ecouter un Ekko : redirige vers le portail
   avant toute autre chose si personne n'est connecte — inutile de
   charger quoi que ce soit d'autre dans ce cas. */
const __session = await requireAuth();
if(!__session) throw new Error('non connecte — redirection en cours');

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const ASKED = params.get('c') || 'Ori';
const AUTOPLAY = params.get('autoplay') === '1';
let IAU = ASKED;

/** Durée de la piste fictive quand aucun audio n'est disponible. */
const DEMO_DURATION = 243;

let sky = null;
let track = null;
let view = null;
let header = null;
let engine = null;
let clock = null;          // élément <audio> ou horloge virtuelle
let chime = null;
let virtual = false;
let scrubbing = false;
let finished = false;

boot();

/* ================================================================ amorçage */

async function boot() {
  paintStatics();

  const [skyData, settings] = await Promise.all([
    getJson('data/ekko-sky.json'),
    getJson('data/player-view.json').catch(() => emptySettings()),
  ]);
  sky = skyData;

  // Le paramètre est accepté sans égard à la casse : la carte passe des
  // identifiants en minuscules (ori, uma) alors que les clés du skyculture
  // sont en casse IAU (Ori, UMa).
  IAU = Object.keys(sky.figures).find((k) => k.toLowerCase() === ASKED.toLowerCase()) ?? ASKED;
  const figure = sky.figures[IAU];
  if (!figure) return fail(`Constellation inconnue : ${ASKED}`);

  const id = IAU.toLowerCase();
  track = await getJson(`content/${id}/cues.json`).catch(() => emptyTrack(IAU, id));

  header = new PlayerHeader($('header'));
  // La catégorie vient de ekko-sky.json, généré depuis la table CATS de
  // index.html : Orion est en « Hiver », pas en « Équatoriales ».
  header.setConstellation({
    name: figure.name,
    group: figure.category ?? '',
    status: 'en pause',
  });

  view = new ConstellationView($('viewport'), {
    data: sky,
    ...toViewOptions(settings, IAU),
  });
  await view.ready;
  view.setFigure(IAU);

  await setupAudio();

  chime = new Chime({
    url: track.chime?.url ?? null,
    gain: track.chime?.enabled === false ? 0 : (track.chime?.gain ?? 0.45),
  });

  engine = new CueEngine({
    audio: clock,
    track,
    chime,
    onCue: renderCue,
    onTime: renderTime,
  });

  buildGlyphs();
  wire();
  engine.sync();

  // Le rideau ne s'ouvre qu'une fois tout monté et peint : c'est ce qui rend
  // le fondu régulier. Ouvrir avant, c'est animer pendant un layout.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $('curtain').setAttribute('data-open', '');
    $('shell').setAttribute('data-in', '');
    if (AUTOPLAY) setTimeout(tryAutoplay, 420);
  }));
}

async function getJson(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(`${url} : HTTP ${r.status}`);
  return r.json();
}

function fail(message) {
  $('curtain').setAttribute('data-open', '');
  $('shell').setAttribute('data-in', '');
  header?.setConstellation({ name: 'Erreur', group: '', status: message });
}

function paintStatics() {
  $('back').innerHTML = `${ICONS.chevronLeft}<span>Retour à la carte</span>`;
  $('account').innerHTML = `${ICONS.account}<span>Mon compte</span>`;
  $('back10').innerHTML = ICONS.rewind10;
  $('fwd10').innerHTML = ICONS.forward10;
  $('play').innerHTML = ICONS.play;
  $('capStart').innerHTML = LINE_START;
  $('capEnd').innerHTML = LINE_END;
}

/* =================================================================== audio */

async function setupAudio() {
  const src = track.audioSrc || `content/${IAU.toLowerCase()}/audio.mp3`;
  if (src) {
    const audio = new Audio();
    audio.preload = 'auto';
    audio.src = src;
    const ok = await new Promise((resolve) => {
      const done = (v) => { clearTimeout(timer); resolve(v); };
      const timer = setTimeout(() => done(false), 6000);
      audio.addEventListener('loadedmetadata', () => done(true), { once: true });
      audio.addEventListener('error', () => done(false), { once: true });
    });
    if (ok) { clock = audio; return; }
  }

  // Sans audio joignable, on tourne sur une horloge virtuelle. Toute la
  // mécanique — cues, carillon, barre, seek — reste testable, ce qui permet de
  // caler l'écran avant que les pistes existent.
  virtual = true;
  clock = virtualClock(track.duration || DEMO_DURATION);
  notice(src ? 'Audio introuvable — horloge de test' : 'Aucun audio — horloge de test');
}

/** Minimum d'API commun avec HTMLAudioElement, pour que CueEngine ne voie rien. */
function virtualClock(duration) {
  let t = 0;
  let playing = false;
  let last = 0;

  const advance = () => {
    if (!playing) return;
    const now = performance.now();
    t = Math.min(duration, t + (now - last) / 1000);
    last = now;
    if (t >= duration) { playing = false; api.dispatchEnded(); }
  };

  const listeners = new Set();
  const api = {
    duration,
    volume: 1,
    get currentTime() { advance(); return t; },
    set currentTime(v) { advance(); t = Math.max(0, Math.min(duration, v)); last = performance.now(); },
    get paused() { advance(); return !playing; },
    play() { advance(); playing = true; last = performance.now(); return Promise.resolve(); },
    pause() { advance(); playing = false; },
    addEventListener(type, fn) { if (type === 'ended') listeners.add(fn); },
    dispatchEnded() { listeners.forEach((fn) => fn()); },
  };
  return api;
}

async function tryAutoplay() {
  try {
    await startPlayback();
  } catch {
    notice('Appuie sur lecture pour démarrer');
  }
}

/**
 * Le `play()` doit partir dans la chaîne du geste utilisateur, sinon le
 * navigateur refuse. On monte ensuite le volume en rampe pour que l'entrée
 * ne soit pas abrupte.
 */
async function startPlayback() {
  await chime.unlock();
  if (!virtual) clock.volume = 0;
  await clock.play();
  if (!virtual) rampVolume(0, 1, 800);
  engine.start();
  paintPlaying(true);
}

function rampVolume(from, to, ms) {
  const t0 = performance.now();
  const step = () => {
    const k = Math.min(1, (performance.now() - t0) / ms);
    clock.volume = from + (to - from) * k;
    if (k < 1) requestAnimationFrame(step);
  };
  step();
}

/* ================================================================ contrôles */

function wire() {
  $('play').addEventListener('click', togglePlay);
  $('back10').addEventListener('click', () => seekBy(-10));
  $('fwd10').addEventListener('click', () => seekBy(10));
  $('stop').addEventListener('click', () => $('confirm').setAttribute('data-open', ''));
  $('confirmNo').addEventListener('click', () => $('confirm').removeAttribute('data-open'));
  $('confirmYes').addEventListener('click', collect);
  $('back').addEventListener('click', () => leave('/'));

  /* La collecte n'a lieu qu'a l'ecoute complete : atteindre la fin
     naturellement doit donc valider la collecte exactement comme le
     raccourci « Terminer » du dialogue d'arret (collect() est le seul
     point qui ecrit la progression, les deux chemins y menent). */
  clock.addEventListener('ended', () => { paintPlaying(false); collect(); });

  const rail = $('rail');
  const at = (e) => {
    const r = rail.getBoundingClientRect();
    return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * (engine.duration || 1);
  };
  $('track').addEventListener('pointerdown', (e) => {
    scrubbing = true;
    $('track').setAttribute('data-scrub', '');
    $('track').setPointerCapture(e.pointerId);
    seekTo(at(e));
  });
  $('track').addEventListener('pointermove', (e) => { if (scrubbing) seekTo(at(e)); });
  $('track').addEventListener('pointerup', () => {
    scrubbing = false;
    $('track').removeAttribute('data-scrub');
  });

  $('track').addEventListener('keydown', (e) => {
    const d = { ArrowLeft: -5, ArrowRight: 5, ArrowDown: -30, ArrowUp: 30 }[e.key];
    if (d === undefined) return;
    e.preventDefault();
    seekBy(d);
  });

  window.addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea')) return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.key === 'Escape') $('confirm').removeAttribute('data-open');
  });

  window.addEventListener('resize', () => requestAnimationFrame(placeCard));
}

/* En paysage telephone, l'ecran de blocage recouvre tout mais le son
   continuerait de jouer derriere si on n'y touchait pas — pas terrible
   pour quelqu'un qui vient de faire pivoter son telephone par erreur en
   pleine ecoute. On coupe la lecture des l'entree dans ce mode ; a
   l'utilisateur de relancer volontairement une fois revenu en portrait. */
matchMedia('(orientation: landscape) and (max-height: 560px)').addEventListener('change', (e) => {
  if(e.matches && clock && !clock.paused){
    togglePlay();
  }
});

async function togglePlay() {
  if (finished) return;
  if (clock.paused) {
    try { await startPlayback(); } catch { notice('Lecture refusée par le navigateur'); }
  } else {
    clock.pause();
    engine.stop();
    engine.sync();
    paintPlaying(false);
  }
}

function paintPlaying(playing) {
  $('play').innerHTML = playing ? ICONS.pause : ICONS.play;
  $('play').setAttribute('aria-label', playing ? 'Pause' : 'Lecture');
  header.setStatus(playing ? 'en lecture' : 'en pause');
}

function seekBy(delta) { seekTo(clock.currentTime + delta); }

function seekTo(t) {
  clock.currentTime = Math.max(0, Math.min(engine.duration || 0, t));
  engine.sync();          // réconciliation immédiate, même à l'arrêt
}

function collect() {
  finished = true;
  clock.pause();
  engine.stop();
  $('confirm').removeAttribute('data-open');
  header.setStatus('ekko récupéré');
  view.clearFocus();
  hideCard();
  // TODO brancher ici la validation de collecte côté profil.
  showCelebration();
}

/** Ecran de celebration : marque le moment plutot que de filer tout de
    suite vers la carte. Le depart effectif n'a lieu qu'au clic sur
    « Continuer l'aventure », voir plus bas. */
function showCelebration() {
  $('celTitle').textContent = (sky?.figures?.[IAU]?.name || IAU || '').toUpperCase();
  $('celebrate').setAttribute('data-open', '');
}

$('celContinue').addEventListener('click', () => {
  leave('/?collected=' + IAU.toLowerCase());
});

/** Fondu sortant symétrique de l'entrée. */
function leave(href) {
  $('curtain').removeAttribute('data-open');
  $('curtain').setAttribute('data-closing', '');
  $('shell').removeAttribute('data-in');
  setTimeout(() => { location.href = href; }, 330);
}

/* ============================================================ barre + cues */

function buildGlyphs() {
  const rail = $('rail');
  rail.querySelectorAll('.glyph').forEach((n) => n.remove());
  // La durée réelle de l'audio l'emporte sur celle du fichier de repères :
  // sur une piste de démonstration elles diffèrent, et les losanges doivent
  // suivre la piste jouée, pas la valeur écrite.
  const d = engine.duration || track.duration || DEMO_DURATION;
  if (!d) return;

  for (const cue of engine.cues) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'glyph';
    b.dataset.cue = cue.id;
    b.style.left = `${(cue.start / d) * 100}%`;
    b.innerHTML = CUE_GLYPH;
    b.title = cue.card?.title ?? 'Moment interactif';
    b.setAttribute('aria-label', `Aller à ${cue.card?.title ?? 'ce moment'}`);
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      // On recule un peu pour que le carillon soit entendu avant la carte.
      seekTo(Math.max(0, cue.start - 1.5));
    });
    rail.append(b);
  }
}

const mmss = (s) => {
  const v = Math.max(0, Math.floor(s || 0));
  return `${String(Math.floor(v / 60)).padStart(2, '0')}:${String(v % 60).padStart(2, '0')}`;
};

function renderTime(t, d) {
  const k = d ? Math.max(0, Math.min(1, t / d)) : 0;
  $('elapsed').style.width = `${k * 100}%`;
  $('head').style.left = `${k * 100}%`;
  $('tNow').textContent = mmss(t);
  $('tEnd').textContent = mmss(d);
  $('track').setAttribute('aria-valuemax', Math.floor(d || 0));
  $('track').setAttribute('aria-valuenow', Math.floor(t));
  $('track').setAttribute('aria-valuetext', `${mmss(t)} sur ${mmss(d)}`);
  if (cardCue) placeCard();
}

let cardCue = null;

function renderCue(cue) {
  for (const g of $('rail').querySelectorAll('.glyph')) {
    g.toggleAttribute('data-active', Boolean(cue) && g.dataset.cue === cue.id);
  }

  if (!cue) { cardCue = null; view.clearFocus(); hideCard(); return; }

  cardCue = cue;
  view.focus(cue.hips ?? []);
  paintCard(cue);
}

function paintCard(cue) {
  const card = $('card');
  const c = cue.card ?? {};
  card.replaceChildren();

  if (c.image) {
    const img = document.createElement('img');
    img.src = c.image;
    img.alt = '';
    card.append(img);
  }
  const h = document.createElement('h2');
  h.textContent = c.title ?? '';
  card.append(h);
  if (c.subtitle) {
    const s = document.createElement('p');
    s.className = 'sub';
    s.textContent = c.subtitle;
    card.append(s);
  }
  if (c.body) {
    const r = document.createElement('div');
    r.className = 'rule';
    const p = document.createElement('p');
    p.className = 'body';
    p.textContent = c.body;
    card.append(r, p);
  }

  card.setAttribute('data-visible', '');
  placeCard();
}

function hideCard() { $('card').removeAttribute('data-visible'); }

/**
 * Ancre la carte sur la première étoile mise en avant, avec bascule quand on
 * approche d'un bord. Les coordonnées viennent de getStarPoint, dont le repère
 * est déjà celui du conteneur en pixels CSS.
 */
function placeCard() {
  const card = $('card');
  if (!cardCue) return;
  const hip = cardCue.hips?.[0];
  const p = hip ? view.getStarPoint(hip) : null;
  const middle = $('middle');

  if (!p) {
    card.style.left = '50%';
    card.style.top = '';
    card.style.bottom = '24px';
    card.style.transform = 'translateX(-50%)';
    return;
  }

  const w = card.offsetWidth;
  const h = card.offsetHeight;
  const box = middle.getBoundingClientRect();
  const gap = 22 + p.r;

  const flipX = p.x + gap + w > box.width - 16;
  const flipY = p.y + gap + h > box.height - 16;

  card.style.bottom = '';
  card.style.transform = '';
  card.style.left = `${Math.max(16, Math.min(box.width - w - 16, flipX ? p.x - gap - w : p.x + gap))}px`;
  card.style.top = `${Math.max(16, Math.min(box.height - h - 16, flipY ? p.y - gap - h : p.y + gap))}px`;
}

/* ==================================================================== note */

let noticeTimer = null;
function notice(text) {
  const n = $('notice');
  n.textContent = text;
  n.setAttribute('data-show', '');
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => n.removeAttribute('data-show'), 4200);
}
</script>
