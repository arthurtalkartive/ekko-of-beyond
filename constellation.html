<style>
:root{
  --cream:#E3E3C4; --c50:rgba(227,227,196,.5); --c20:rgba(227,227,196,.2);
  --w30:rgba(255,255,255,.3); --ink:#050B14;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Afacad',system-ui,sans-serif;color:var(--cream);background:#04070B}
/* Fond de page : le ciel étoilé du splash, assombri de moitié pour que le
   texte reste lisible. Le voile est un réglage à part, facile à ajuster. */
#pagebg{position:fixed;inset:0;z-index:0;pointer-events:none}
#pagebg img{width:100%;height:100%;object-fit:cover;object-position:center bottom;
  opacity:0;transition:opacity .5s ease}
#pagebg img.ready{opacity:1}
#pagebg .ov{position:absolute;inset:0;background:rgba(0,0,0,.5)}
button{font-family:inherit;color:inherit}
a{color:inherit}
img,video{max-width:100%;display:block}

/* ---------- en-tête ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;
  padding:calc(14px + var(--st)) 26px 14px;
  background:linear-gradient(180deg,rgba(3,6,10,.96),rgba(3,6,10,.62));
  border-bottom:1px solid var(--c20);backdrop-filter:blur(12px)}
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  border:1px solid var(--c50);border-radius:999px;padding:9px 16px;font-size:11.5px;
  font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.8;
  transition:opacity .2s,background .2s;white-space:nowrap}
.back:hover{opacity:1;background:rgba(227,227,196,.08)}
.top .sp{flex:1}
.top .where{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.45;white-space:nowrap}

/* ---------- la constellation, ciel réel isolé ---------- */
.hero{position:relative;height:min(64vh,620px);min-height:380px;overflow:hidden;
  background:linear-gradient(180deg,#000,#0A1931)}
/* Aucun événement de pointeur : la navigation dans le ciel est donc
   impossible sur cette fiche, comme demandé. */
#sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .veil{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(4,7,11,.55) 0%,transparent 26%,transparent 58%,#04070B 100%)}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:0 26px 30px;text-align:center}
.hero .cat{display:inline-block;padding:3px 12px;border-radius:2000px;background:var(--w30);
  font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff;opacity:.85}
.hero h1{margin-top:12px;font-size:clamp(34px,7vw,58px);font-weight:700;
  text-transform:uppercase;line-height:1.03}
.hero .latin{margin-top:2px;font-size:16px;font-style:italic;opacity:.55}
.hero .live{position:absolute;left:22px;top:18px;display:inline-flex;align-items:center;gap:7px;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.45}
.hero .live i{width:5px;height:5px;border-radius:50%;background:var(--cream)}

main{position:relative;z-index:1}
.wrap{width:min(1080px,100%);margin:0 auto;padding:0 24px}
.narrow{width:min(700px,100%);margin:0 auto}

/* ---------- onglets ---------- */
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:34px 24px 12px;
  position:sticky;top:calc(52px + var(--st));z-index:20;
  background:linear-gradient(180deg,rgba(4,7,11,.9) 45%,rgba(4,7,11,0) 100%);
  backdrop-filter:blur(6px)}
.tab{padding:11px 28px;border-radius:20000px;cursor:pointer;border:1px solid var(--c50);
  background:linear-gradient(180deg,rgba(227,227,196,.02),rgba(227,227,196,.1));
  font-weight:700;font-size:15px;text-transform:uppercase;white-space:nowrap;
  transition:background .2s,color .2s,border-color .2s}
.tab:hover{background:linear-gradient(180deg,rgba(227,227,196,.08),rgba(227,227,196,.2))}
.tab.on{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.pane{display:none;padding-bottom:70px}
.pane.on{display:block}

/* ---------- blocs éditoriaux ---------- */
.b-lead{font-size:clamp(20px,2.4vw,26px);line-height:1.5;padding:44px 0 10px;
  font-weight:400}
.b-lead::first-letter{font-size:2.6em;float:left;line-height:.82;padding:6px 12px 0 0;
  font-weight:700}
.b-text{padding:16px 0}
.b-text h3{font-size:11px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;
  opacity:.5;margin-bottom:14px}
.b-text p{font-size:17px;line-height:1.72;opacity:.86}
.b-text p + p{margin-top:15px}

.b-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  border-top:1px solid var(--c20);border-bottom:1px solid var(--c20);margin:40px 0}
.b-stats > div{padding:24px 22px;border-left:1px solid var(--c20)}
.b-stats > div:first-child{border-left:none}
.b-stats .v{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.b-stats .u{font-size:13px;opacity:.55;margin-left:5px;font-weight:400}
.b-stats .l{margin-top:9px;font-size:12.5px;line-height:1.5;opacity:.6}

figure{margin:38px 0}
/* Les schémas gagnent à respirer : ils sortent de la colonne de texte et
   vont jusqu'à 1320 px, centrés. */
figure.wide{width:min(1320px,calc(100vw - 48px));margin-left:50%;
  transform:translateX(-50%);margin-top:52px;margin-bottom:52px}
@media (max-width:820px){ figure.wide{width:calc(100vw - 32px);margin-top:36px;margin-bottom:36px} }
.frame{border:1px solid var(--c20);border-radius:12px;overflow:hidden;background:#020407;
  position:relative}
.frame img,.frame svg{width:100%;height:auto;display:block}
.frame.lit img{mix-blend-mode:screen}
figcaption{margin-top:11px;font-size:13.5px;line-height:1.6;opacity:.62}
figcaption b{font-weight:700;opacity:.85}
figcaption .credit{display:block;margin-top:4px;font-size:11.5px;opacity:.6}
.missing{padding:44px 26px;text-align:center;font-size:13px;line-height:1.7;opacity:.45}
.missing code{font-family:ui-monospace,monospace;font-size:12px}
.missing a{text-decoration:underline}

.b-split{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center;margin:44px 0}
.b-split.rev > .media{order:2}
.b-split h3{font-size:11px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;
  opacity:.5;margin-bottom:13px}
.b-split p{font-size:16.5px;line-height:1.7;opacity:.86}
.b-split p + p{margin-top:13px}
.b-split figure{margin:0}

.b-quote{margin:48px 0;padding:0 0 0 26px;border-left:2px solid var(--cream)}
.b-quote p{font-size:clamp(21px,2.4vw,27px);line-height:1.45;font-style:italic}
.b-quote .who{margin-top:14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.55}

.b-video{margin:44px 0}
.ratio{position:relative;padding-top:56.25%;border:1px solid var(--c20);border-radius:12px;
  overflow:hidden;background:#020407}
.ratio iframe,.ratio video,.ratio .missing{position:absolute;inset:0;width:100%;height:100%;border:0}
.ratio .missing{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px}
.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;cursor:pointer}
.playbtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:70px;height:70px;border-radius:50%;border:1px solid var(--cream);
  background:rgba(4,7,11,.55);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .2s}
.playbtn:hover{background:rgba(227,227,196,.22)}
.playbtn svg{width:24px;height:24px;margin-left:3px}

/* Zones sensibles des schémas : un curseur d'aide et une infobulle qui
   suit le pointeur. Les zones sont des cercles transparents posés dans le
   SVG, plus larges que les points pour rester attrapables au doigt. */
.hot{cursor:help}
.hot:hover circle.halo,.hot:focus circle.halo{opacity:.5}
.hot circle.halo{opacity:0;transition:opacity .18s}
#tip{position:fixed;z-index:60;max-width:290px;padding:11px 13px;border-radius:10px;
  border:1px solid var(--c50);background:rgba(4,8,14,.97);backdrop-filter:blur(8px);
  font-size:13px;line-height:1.5;pointer-events:none;opacity:0;
  transform:translateY(5px);transition:opacity .15s,transform .15s}
#tip.on{opacity:1;transform:translateY(0)}
#tip b{display:block;font-size:14px;font-weight:700;margin-bottom:4px}
#tip .k{display:block;margin-top:6px;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;opacity:.5}

/* Image cliquable : plein ecran avec voile et legende dessous. */
.frame.zoom img{cursor:zoom-in}
#lb{position:fixed;inset:0;z-index:80;display:none;
  background:rgba(2,4,8,.94);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;flex-direction:column;
  gap:18px;padding:38px 24px;opacity:0;transition:opacity .22s}
#lb.on{display:flex}
#lb.vis{opacity:1}
#lb img{max-width:min(1500px,94vw);max-height:76vh;width:auto;height:auto;
  border:1px solid var(--c20);border-radius:10px;background:#020407}
#lb .cap{max-width:760px;text-align:center;font-size:14.5px;line-height:1.6;opacity:.78}
#lb .cap .credit{display:block;margin-top:6px;font-size:12px;opacity:.6}
#lb .close{position:absolute;right:22px;top:calc(18px + var(--st));
  width:44px;height:44px;border-radius:50%;border:1px solid var(--c50);
  background:rgba(227,227,196,.06);cursor:pointer;font-size:20px;line-height:1}
#lb .close:hover{background:rgba(227,227,196,.2)}
#lb .hint{position:absolute;left:0;right:0;bottom:calc(14px + var(--sb));
  text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.35}

/* Redressement : la figure du skyculture est dessinee de biais par rapport
   a l'ecran. On lui applique l'angle valide dans l'outil de verification,
   et on la reduit juste assez pour que ses coins ne soient pas rognes. */
.frame.roll{display:flex;align-items:center;justify-content:center}
.frame.roll img{transition:transform .3s ease}

.b-warn{margin:40px 0;border:1px solid rgba(227,208,138,.45);border-radius:12px;
  padding:20px 22px;background:rgba(227,208,138,.06);font-size:15px;line-height:1.65}
.b-warn h3{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  margin-bottom:9px;color:#E3D08A}

.b-links{margin:52px 0 0;border-top:1px solid var(--c20);padding-top:26px}
.b-links h3{font-size:11px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;
  opacity:.5;margin-bottom:16px}
.lk{display:flex;gap:14px;align-items:baseline;text-decoration:none;padding:13px 0;
  border-bottom:1px solid rgba(227,227,196,.1);transition:opacity .2s}
.lk:hover{opacity:.65}
.lk .kind{flex:none;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid var(--c50);border-radius:2000px;padding:2px 8px;opacity:.8}
.lk .kind.watch{border-color:#E3D08A;color:#E3D08A}
.lk .kind.look{border-color:#9BD9B0;color:#9BD9B0}
.lk .kind.deep{border-color:#A8B8E0;color:#A8B8E0}
.lk .body{flex:1}
.lk .t{font-size:16px;font-weight:700;line-height:1.3}
.lk .n{margin-top:4px;font-size:13.5px;line-height:1.55;opacity:.6}
.lk .src{flex:none;font-size:11px;opacity:.42;text-align:right;max-width:150px}

.cms{border-top:1px solid var(--c20);margin-top:40px;padding:24px 0 0;
  font-size:12.5px;line-height:1.7;opacity:.4}
.soon{text-align:center;padding:70px 20px;font-size:15px;opacity:.5;line-height:1.7}

@media (max-width:760px){
  .wrap{padding:0 16px}
  .b-split{grid-template-columns:1fr;gap:22px}
  .b-split.rev > .media{order:0}
  .b-stats > div{border-left:none;border-top:1px solid var(--c20)}
  .b-stats > div:first-child{border-top:none}
  .top{padding-left:14px;padding-right:14px}
  .top .where{display:none}
  /* Les 3 onglets en flex+wrap classique passaient en 2+1 des qu'ils ne
     tenaient plus sur une ligne (Science + Mythologie, puis Astrologie
     seul, centre en dessous) : pas casse, mais pas voulu non plus. En
     dessous de 760px on les fige a largeur egale sur une seule ligne. */
  .tabs{gap:8px;padding:24px 14px 10px;flex-wrap:nowrap}
  .tab{flex:1 1 0;min-width:0;padding:10px 8px;font-size:12.5px;
    text-align:center;overflow:hidden;text-overflow:ellipsis}
  .lk{flex-wrap:wrap}
  .lk .src{text-align:left;max-width:none}
  .b-lead{font-size:19px}
}
@media (max-width:400px){
  .tab{padding:9px 3px;font-size:10.5px;letter-spacing:-.01em}
}
/* En paysage telephone, le `min-height:380px` du hero (pense pour un
   ecran haut) pouvait a lui seul occuper la quasi-totalite de la
   hauteur visible, reduisant tout le reste — onglets, texte — a du
   contenu qu'il fallait defiler pour meme apercevoir. */
@media (max-height:500px){
  .hero{height:min(52vh,320px);min-height:180px}
  .hero h1{font-size:clamp(26px,6vw,40px)}
  .tabs{padding-top:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ================= BLOCAGE PAYSAGE MOBILE =================
   Meme logique que sur les autres pages publiques : le paysage sur
   telephone ne laisse pas assez de hauteur pour lire confortablement une
   fiche, malgre le hero deja reduit ci-dessus. `max-height` en paysage
   correspond a la largeur reelle de l'appareil, ce qui distingue un
   telephone (quasiment jamais plus de 560px sur le petit cote) d'une
   tablette, jamais bloquee ici. */
#landscape-lock{
  position:fixed;inset:0;z-index:9999;
  display:none;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#000 0%,#0A1931 100%);
  padding:40px;text-align:center;
}
.ll-box{max-width:360px}
.ll-icon{width:60px;height:60px;color:var(--cream);margin:0 auto 22px;display:block;
  animation:ll-rotate 2.6s ease-in-out infinite}
@keyframes ll-rotate{0%,15%{transform:rotate(0deg)}50%,65%{transform:rotate(-90deg)}100%{transform:rotate(-90deg)}}
.ll-title{font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.05em;color:var(--cream)}
.ll-sub{margin-top:10px;font-size:14.5px;line-height:1.55;color:var(--cream);opacity:.6}
@media (orientation:landscape) and (max-height:560px){
  #landscape-lock{display:flex}
}
</style>
</head>
<body>

<div id="landscape-lock" aria-hidden="true">
  <div class="ll-box">
    <svg class="ll-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="20" y="7" width="24" height="42" rx="4" stroke="currentColor" stroke-width="2"/>
      <line x1="28" y1="43" x2="36" y2="43" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M49 24a17 17 0 1 0 -5 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M44 30l5 6 6-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="ll-title">Tournez votre téléphone</div>
    <p class="ll-sub">Cette fiche est pensée pour le mode portrait sur mobile. Repassez en portrait pour continuer.</p>
  </div>
</div>

<div id="tip" role="tooltip"></div>
<div id="lb" role="dialog" aria-modal="true" aria-label="Image en plein écran">
  <button class="close" id="lb-close" aria-label="Fermer">&times;</button>
  <img id="lb-img" src="" alt="">
  <div class="cap" id="lb-cap"></div>
  <div class="hint">Cliquez ou appuyez sur Échap pour fermer</div>
</div>
<div id="pagebg"><img src="/assets/img/splash-background.webp" alt="" decoding="async"><div class="ov"></div></div>

<div class="top">
  <a class="back" href="/">&larr;&nbsp; Collection</a>
  <span class="sp"></span>
  <span class="where" id="where">En savoir plus</span>
</div>

<section class="hero">
  <canvas id="sky"></canvas>
  <div class="veil"></div>
  <div class="live"><i></i><span id="live">Ciel réel</span></div>
  <div class="cap">
    <span class="cat" id="cat"></span>
    <h1 id="name">—</h1>
    <div class="latin" id="latin"></div>
  </div>
</section>

<main>
  <nav class="tabs" id="tabs"></nav>
  <div id="panes"></div>
  <div class="wrap"><p class="cms" id="cms"></p></div>
</main>
<script src="/vendor/stellarium-web-engine.js"></script>
<script>
/* Il faut un compte pour consulter une fiche : redirige vers le portail
   avant tout le reste si personne n'est connecte. Verification
   asynchrone (ce script n'est pas un module ; import() dynamique reste
   le seul moyen d'atteindre supa.js depuis un script classique) — les
   donnees ci-dessous se chargent sans risque en attendant, mais le
   rendu proprement dit, plus bas, attend __ekkoAuthOk avant de s'y
   risquer. */

   Chaque onglet est une SUITE DE BLOCS typés, et non une liste de

   directement modélisable : une table de blocs, un type, un ordre, une
   charge utile en JSON.

   Types disponibles :
     lead    chapeau, avec lettrine
     text    { h?, p:[...] }
     stats   [{ v, u?, l }]
     figure  { src | svg, alt?, cap, credit?, lit?, wide?, link? }
     split   { h?, p:[...], media:{figure}, rev? }

     links   [{ kind, title, src, note, url }]

/* ============================================================
   SCHÉMAS PARAMÉTRÉS

   Les trois schémas d'Orion etaient dessines en dur pour Orion : aucune
   autre figure ne pouvait en avoir. Ils sont desormais pilotes par les
   donnees du bloc, ce qui les rend disponibles pour les 53 figures sans
   ecrire une ligne de code de plus.

   Un bloc figure s'ecrit :
     { "t":"figure", "svg":"scale", "wide":true, "data":{...}, "cap":"…" }

   Cinq types :
     scale     comparaison de rayons stellaires, en rayons solaires
     depth     distances reelles derriere un alignement apparent
     compass   la figure elle-meme, avec des visees vers ses voisines
     timeline  une chronologie
     bars      une comparaison chiffree quelconque

   Chaque point porte une zone sensible et son infobulle.
   ============================================================ */

/* Zone sensible : un cercle transparent plus large que le point. */

      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };
  return '<g class="hot" tabindex="0" data-t="' + at(title) + '"'
    + ' data-b="' + at(body) + '" data-n="' + at(note || '') + '">'
    + '<circle class="halo" cx="' + cx + '" cy="' + cy + '" r="' + (r + 9).toFixed(1)
      + '" fill="none" stroke="#E3E3C4" stroke-width="1.4"/>'
    + '<circle cx="' + cx + '" cy="' + cy + '" r="' + Math.max(18, r).toFixed(1)
      + '" fill="transparent"/></g>';
}

const SV_CREAM = 'rgba(227,227,196,';

/* ================================================================
   SCHÉMAS INTERACTIFS — RESPONSIVE

   Ces schémas sont des SVG entièrement générés (voir les fonctions
   svScale/svDepth/svCompass/svTimeline/svBars ci-dessous), affichés en
   `width:100%` : le viewBox les redimensionne déjà à la largeur de
   l'écran. Le problème n'est pas là — il est que jusqu'ici, le texte
   partageait le même facteur d'échelle que le reste du dessin. Un titre
   à 13 unités sur un canevas de 1000 de large, affiché dans les ~356px
   utiles d'un téléphone, rendait à peine 5px de haut : illisible, quel
   que soit le soin apporté au dessin.

   COMPACT bascule chaque fonction sur des constantes pensées pour cette
   largeur-là plutôt que sur une réduction proportionnelle du dessin
   grand écran : texte agrandi, espacements et hauteurs de ligne redonnés
   en conséquence pour que rien ne se chevauche. Le tracé (traits,
   cercles, positions) garde les mêmes proportions ; seul ce qui doit
   rester lisible à taille humaine change vraiment.

   Évalué une fois au chargement — cohérent avec le reste de la page, qui
   ne réagit déjà pas au changement d'orientation en direct — et
   recalculé si la largeur franchit le seuil (rotation, fenêtre
   redimensionnée), via reflowSchemas() plus bas. */
let COMPACT = matchMedia('(max-width: 760px)').matches;
/** Choisit la valeur adaptée au mode courant. V(large, compact). */
function V(a, b){ return COMPACT ? b : a; }

function svTitle(t){
  return '<text x="' + V(44, 18) + '" y="' + V(46, 27) + '" font-family="Afacad,sans-serif"'
    + ' font-size="' + V(13, 31) + '" letter-spacing="' + V(2.6, 1.3) + '"'
    + ' fill="' + SV_CREAM + '.45)">' + esc(String(t || '').toUpperCase())
    + '</text>';
}
function svLabel(x, y, main, sub, anchor){
  let o = '<text x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" text-anchor="' + (anchor || 'middle')
    + '" font-family="Afacad,sans-serif" font-size="' + V(16, 40) + '" font-weight="700"'
    + ' fill="' + SV_CREAM + '.9)" letter-spacing="' + V(1.4, 0.4) + '">' + esc(main) + '</text>';
  if(sub) o += '<text x="' + x.toFixed(1) + '" y="' + (y + V(19, 46)).toFixed(1) + '" text-anchor="'
    + (anchor || 'middle') + '" font-family="Afacad,sans-serif" font-size="' + V(13, 31) + '"'
    + ' fill="' + SV_CREAM + '.5)">' + esc(sub) + '</text>';
  return o;
}
function svOpen(W, H){
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">'
    + '<rect width="' + W + '" height="' + H + '" fill="#020407"/>';
}
function nfr(x){
  /* espace insecable fine comme separateur de milliers */
  return String(x).replace(/\B(?=(\d{3})+(?!\d))/g, '\u202f');
}

/* ---------- scale : rayons stellaires comparés ---------- */
function svScale(d){
  const items = (d.items || []).slice().sort(function(a, b){ return b.r - a.r; });
  if(!items.length) return '';
  const W = 1000, H = V(480, 620), gap = V(34, 56);
  const rmax = items[0].r;
  const sum = items.reduce(function(a, x){ return a + x.r; }, 0);
  /* Marges reservees en haut/bas pour le titre et l'etiquette du plus
     gros disque : sans elles l'etiquette se pose sur le cercle. Plus
     genereuses en compact, ou le texte est nettement plus grand. */
  const topM = V(96, 160), botM = V(56, 195), sideM = V(120, 90);
  const k = Math.min((H - topM - botM) / (2 * rmax),
                     (W - sideM - gap * (items.length - 1)) / (2 * sum));
  /* le groupe est centre horizontalement, il ne colle plus a gauche */
  const total = 2 * sum * k + gap * (items.length - 1);
  let o = svOpen(W, H) + svTitle(d.title || 'Rayons comparés, à la même échelle');
  let x = Math.max(40, (W - total) / 2), hots = '';
  let belowToggle = false;
  items.forEach(function(it){
    const rr = Math.max(2, it.r * k);
    const cx = x + rr, cy = topM + rmax * k;
    const col = it.c || '#E3E3C4';
    o += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy + '" r="' + rr.toFixed(1)
       + '" fill="' + col + '" fill-opacity="' + (rr > 12 ? '.16' : '1')
       + '" stroke="' + col + '" stroke-width="1.5"/>';
    /* l'etiquette va au-dessus du disque, ou en dessous s'il est minuscule.
       Des petits disques rapproches (ex. deux planetes cote a cote) ont des
       centres trop proches pour deux etiquettes en dessous, une fois le
       texte agrandi en compact : elles alternent alors un cran plus bas. */
    const above = rr > V(26, 46);
    let belowExtra = 0;
    if(!above){ belowExtra = belowToggle ? V(0, 92) : 0; belowToggle = !belowToggle; }
    o += svLabel(cx, above ? cy - rr - V(32, 72) : cy + rr + V(34, 90) + belowExtra,
                 it.n, it.sub || (nfr(it.r) + ' R\u2609'));
    hots += hot(cx, cy, Math.max(16, rr), it.n, it.note || '',
                nfr(it.r) + ' rayon' + (it.r > 1 ? 's' : '') + ' solaire' + (it.r > 1 ? 's' : ''));
    x = cx + rr + gap;
  });
  return o + hots + '</svg>';
}

/* ---------- depth : distances réelles ---------- */
function svDepth(d){
  const st = (d.stars || []).slice().sort(function(a, b){ return a.d - b.d; });
  if(!st.length) return '';
  const W = 1000, rows = st.length;
  const rowH = V(74, 128);
  const H = V(150, 210) + rows * rowH;
  const maxD = d.max || (Math.ceil(Math.max.apply(null, st.map(function(s){ return s.d; })) * 1.12 / 100) * 100);
  const x0 = V(140, 120), x1 = V(880, 860);
  let o = svOpen(W, H) + svTitle(d.title || 'Distance depuis la Terre');
  const step = maxD <= 60 ? 10 : maxD <= 300 ? 50 : maxD <= 1200 ? 200 : 500;
  const axisFont = V(13, 27), axisBottom = V(28, 46), axisTop = V(66, 84);
  for(let v = 0; v <= maxD; v += step){
    const x = x0 + (v / maxD) * (x1 - x0);
    o += '<line x1="' + x.toFixed(1) + '" y1="' + axisTop + '" x2="' + x.toFixed(1) + '" y2="' + (H - V(54, 92))
       + '" stroke="' + SV_CREAM + '.09)"/>';
    o += '<text x="' + x.toFixed(1) + '" y="' + (H - axisBottom) + '" text-anchor="middle"'
       + ' font-family="Afacad,sans-serif" font-size="' + axisFont + '" fill="' + SV_CREAM + '.4)">'
       + (v ? nfr(v) + ' a.l.' : (d.origin || 'Terre')) + '</text>';
  }
  const oy = H / 2;
  const originR = V(6, 11);
  o += '<circle cx="' + x0 + '" cy="' + oy + '" r="' + originR + '" fill="#8FD0C9"/>';
  let hots = hot(x0, oy, originR, d.origin || 'La Terre',
    d.originNote || "Le point de vue. C'est lui qui fait apparaitre les etoiles alignees.",
    'Origine du schéma');
  const dotR = V(8, 13), nameFont = V(16, 30), distFont = V(13.5, 24), labelGap = V(16, 22);
  st.forEach(function(s, i){
    const x = x0 + (s.d / maxD) * (x1 - x0);
    const y = V(110, 150) + i * rowH;
    o += '<line x1="' + x0 + '" y1="' + oy + '" x2="' + x.toFixed(1) + '" y2="' + y
       + '" stroke="' + SV_CREAM + '.22)" stroke-dasharray="3 5"/>';
    o += '<circle cx="' + x.toFixed(1) + '" cy="' + y + '" r="' + dotR + '" fill="#E3E3C4"/>';
    if(COMPACT){
      /* Le nom a gauche du point manquait de place pour les etoiles
         proches de la Terre, une fois la police agrandie : nom au-dessus,
         distance en dessous, toujours centres — la place verticale ne
         depend pas de la position horizontale du point. */
      o += '<text x="' + x.toFixed(1) + '" y="' + (y - dotR - 14) + '" text-anchor="middle"'
         + ' font-family="Afacad,sans-serif" font-size="' + nameFont + '" font-weight="700"'
         + ' fill="' + SV_CREAM + '.9)">' + esc(s.n) + '</text>';
      o += '<text x="' + x.toFixed(1) + '" y="' + (y + dotR + distFont + 10) + '" text-anchor="middle"'
         + ' font-family="Afacad,sans-serif" font-size="' + distFont + '" fill="' + SV_CREAM + '.5)">'
         + nfr(s.d) + ' a.l.</text>';
    }else{
      o += '<text x="' + (x - labelGap).toFixed(1) + '" y="' + (y + 6) + '" text-anchor="end"'
         + ' font-family="Afacad,sans-serif" font-size="' + nameFont + '" font-weight="700"'
         + ' fill="' + SV_CREAM + '.9)">' + esc(s.n) + '</text>';
      o += '<text x="' + (x + labelGap + 2).toFixed(1) + '" y="' + (y + 6) + '"'
         + ' font-family="Afacad,sans-serif" font-size="' + distFont + '" fill="' + SV_CREAM + '.5)">'
         + nfr(s.d) + ' a.l.</text>';
    }
    hots += hot(x, y, dotR, s.n, s.note || '', s.sub || (nfr(s.d) + ' années-lumière'));
  });
  return o + hots + '</svg>';
}

/* ---------- compass : la figure et ses visées ----------
   Les positions viennent des coordonnees reelles embarquees dans CONS :
   le trace de la figure courante, et les etoiles cibles cherchees par leur
   nom dans les autres figures. Rien n'est dessine a la main. */
function findStar(name){
  const want = String(name).toLowerCase();
  for(let i = 0; i < CONS.length; i++){
    const st = CONS[i].s;
    for(let j = 0; j < st.length; j++){
      if(String(st[j][3] || '').toLowerCase() === want) return { ra: st[j][0], dec: st[j][1], cid: CONS[i].id };
    }
  }
  return null;
}
function svCompass(d){
  const D2R = Math.PI / 180;
  const targets = (d.targets || []).map(function(t){
    const p = findStar(t.star);
    return p ? { ra: p.ra, dec: p.dec, t: t } : null;
  }).filter(Boolean);

  const own = C.s.map(function(s){ return { ra: s[0], dec: s[1], mag: s[2], n: s[3] }; });
  /* Le cadrage se fait sur la FIGURE seule. Inclure des cibles lointaines
     comme Polaris reduisait la constellation a un amas illisible ; les
     cibles sont donc reportees au bord du cadre, dans leur direction
     reelle. La direction reste juste, l'echelle ne l'est plus — c'est le
     compromis d'une carte de reperage. */
  const all = own;

  /* projection stereographique centree sur la figure */
  let cx = 0, cy = 0, cz = 0;
  const uv = all.map(function(p){
    const ra = p.ra * 15 * D2R, dec = p.dec * D2R;
    const u = [Math.cos(dec) * Math.cos(ra), Math.cos(dec) * Math.sin(ra), Math.sin(dec)];
    cx += u[0]; cy += u[1]; cz += u[2];
    return u;
  });
  const n = Math.hypot(cx, cy, cz) || 1; cx /= n; cy /= n; cz /= n;
  const ra0 = Math.atan2(cy, cx), dec0 = Math.asin(Math.max(-1, Math.min(1, cz)));
  const proj = function(raH, decD){
    const ra = raH * 15 * D2R, dec = decD * D2R, dr = ra - ra0;
    const den = 1 + Math.sin(dec0) * Math.sin(dec) + Math.cos(dec0) * Math.cos(dec) * Math.cos(dr);
    const kk = 2 / (Math.abs(den) < 1e-9 ? 1e-9 : den);
    return [kk * Math.cos(dec) * Math.sin(dr),
            kk * (Math.cos(dec0) * Math.sin(dec) - Math.sin(dec0) * Math.cos(dec) * Math.cos(dr))];
  };
  const pts = all.map(function(p){ return proj(p.ra, p.dec); });
  const xs = pts.map(function(p){ return p[0]; }), ys = pts.map(function(p){ return p[1]; });
  const spanX = Math.max.apply(null, xs) - Math.min.apply(null, xs);
  const spanY = Math.max.apply(null, ys) - Math.min.apply(null, ys);
  const W = 1000, H = V(560, 640);
  /* la figure occupe la moitie du cadre, la couronne exterieure recoit les cibles */
  const k = Math.min(V(400, 380) / (spanX || 1e-6), V(210, 230) / (spanY || 1e-6));
  const mx = (Math.max.apply(null, xs) + Math.min.apply(null, xs)) / 2;
  const my = (Math.max.apply(null, ys) + Math.min.apply(null, ys)) / 2;
  const CX = W / 2, CY = H / 2 + 14;
  /* nord en haut, est a gauche : convention des cartes du ciel */
  const S = pts.map(function(p){ return [CX - (p[0] - mx) * k, CY - (p[1] - my) * k]; });

  /* Cibles : direction vraie, distance forcee au bord du cadre. Marge
     agrandie en compact pour laisser la place aux etiquettes, bien plus
     grandes. */
  const edgeMX = V(130, 210), edgeMY = V(66, 120);
  const T = targets.map(function(x){
    const q = proj(x.ra, x.dec);
    let dx = -(q[0] - mx), dy = -(q[1] - my);
    const n2 = Math.hypot(dx, dy) || 1;
    dx /= n2; dy /= n2;
    /* rayon maximal tenant dans le cadre pour cette direction */
    const rx = (W / 2 - edgeMX) / Math.max(0.001, Math.abs(dx));
    const ry = (H / 2 - edgeMY) / Math.max(0.001, Math.abs(dy));
    const rr = Math.min(rx, ry);
    return [CX + dx * rr, CY + dy * rr];
  });

  let o = svOpen(W, H) + svTitle(d.title || (C.n + ', et ce qu\'elle permet de trouver'));
  /* le trace de la figure */
  (C.L || []).forEach(function(seg){
    const a = S[seg[0]], b = S[seg[1]];
    if(!a || !b) return;
    o += '<line x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1)
       + '" y2="' + b[1].toFixed(1) + '" stroke="#E3E3C4" stroke-width="1.5" opacity=".75"/>';
  });
  /* les visees, en pointille */
  targets.forEach(function(x, i){
    const from = x.t.from ? own.findIndex(function(s){
      return String(s.n || '').toLowerCase() === String(x.t.from).toLowerCase(); }) : -1;
    const a = S[from >= 0 ? from : 0], b = T[i];
    o += '<line x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1)
       + '" y2="' + b[1].toFixed(1) + '" stroke="#8FD0C9" stroke-width="1.1"'
       + ' stroke-dasharray="5 6" opacity=".7"/>';
  });
  let hots = '';
  const starFont = V(15, 27), starGap = V(10, 15);
  /* Decale verticalement l'etiquette d'une etoile quand une autre, deja
     posee, est trop proche : les positions viennent d'une vraie
     projection RA/Dec, rien ne garantit que deux etoiles voisines dans le
     ciel laissent assez de place a deux noms l'un a cote de l'autre —
     surtout une fois le texte agrandi en compact. */
  function declutterY(placed, x, y, dxTol, dyTol, step){
    let ny = y, guard = 0;
    while(guard++ < 6 && placed.some(function(p){ return Math.abs(p.x - x) < dxTol && Math.abs(p.y - ny) < dyTol; })){
      ny += step;
    }
    placed.push({ x: x, y: ny });
    return ny;
  }
  const ownPlaced = [];
  const ownDxTol = V(80, 170), ownDyTol = V(16, 30), ownStep = V(15, 30);
  own.forEach(function(s, i){
    const r = Math.max(4.5, 7.6 - s.mag * 0.9);
    o += '<circle cx="' + S[i][0].toFixed(1) + '" cy="' + S[i][1].toFixed(1) + '" r="' + r.toFixed(1)
       + '" fill="#E3E3C4"/>';
    if(s.n){
      const lx = S[i][0] + r + starGap;
      const ly = declutterY(ownPlaced, lx, S[i][1] + 5, ownDxTol, ownDyTol, ownStep);
      o += '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '"'
         + ' font-family="Afacad,sans-serif" font-size="' + starFont + '" fill="' + SV_CREAM + '.85)">'
         + esc(s.n) + '</text>';
      const note = (d.notes && d.notes[s.n]) || '';
      hots += hot(S[i][0], S[i][1], r, s.n, note, 'Magnitude ' + s.mag);
    }
  });
  const targetR = V(7, 11), targetGap = V(16, 34), targetFont = V(15, 27);
  const targetPlaced = [];
  const targetDxTol = V(90, 190), targetDyTol = V(16, 30), targetStep = V(15, 44);
  const closeNeighborThresh = V(60, 140);
  targets.forEach(function(x, i){
    const p = T[i];
    o += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + targetR + '" fill="#8FD0C9"/>';
    /* l'etiquette part vers l'exterieur, pour ne pas revenir sur la figure.
       Mais deux cibles proches l'une de l'autre, toutes deux « a gauche »
       du centre par exemple, etendaient parfois leur texte l'une vers
       l'autre plutot que de s'ecarter : quand une cible voisine est
       proche, la direction se decide par rapport a elle, pas au centre. */
    let neighborX = null, bestD = Infinity;
    targets.forEach(function(_, j){
      if(j === i) return;
      const d2 = Math.abs(T[j][0] - p[0]);
      if(d2 < bestD){ bestD = d2; neighborX = T[j][0]; }
    });
    const right = (neighborX !== null && bestD < closeNeighborThresh)
      ? p[0] >= neighborX
      : p[0] >= CX;
    const lx = p[0] + (right ? targetGap : -targetGap);
    const ly = declutterY(targetPlaced, lx, p[1] + 5, targetDxTol, targetDyTol, targetStep);
    o += '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '"'
       + ' text-anchor="' + (right ? 'start' : 'end') + '"'
       + ' font-family="Afacad,sans-serif" font-size="' + targetFont + '" fill="' + SV_CREAM + '.8)">'
       + esc(x.t.label || x.t.star) + '</text>';
    hots += hot(p[0], p[1], targetR, x.t.label || x.t.star, x.t.note || '', x.t.sub || '');
  });
  return o + hots + '</svg>';
}

/* ---------- timeline : une chronologie ---------- */
function svTimeline(d){
  const ev = (d.events || []).slice().sort(function(a, b){ return a.y - b.y; });
  if(!ev.length) return '';
  const W = 1000, H = V(400, 560);
  /* Espacement REGULIER, et non proportionnel aux dates : une chronologie
     dont les evenements se pressent sur deux siecles et s'espacent sur
     mille ans devient illisible en echelle vraie. Ce qui compte ici est la
     sequence, pas la metrique. */
  const x0 = V(150, 90), x1 = V(850, 910), axis = H / 2 + V(18, 10);
  let o = svOpen(W, H) + svTitle(d.title || 'Repères chronologiques');
  o += '<line x1="' + x0 + '" y1="' + axis + '" x2="' + x1 + '" y2="' + axis
     + '" stroke="' + SV_CREAM + '.28)" stroke-width="1.2"/>';
  let hots = '';
  const tickLen = V(20, 26), tyOff = V(34, 50), dotR = V(7, 12);
  const whenFont = V(17, 26), lblFont = V(13.5, 22), lineH = V(19, 30), firstLine = V(22, 32);
  ev.forEach(function(e, i){
    const x = ev.length === 1 ? (x0 + x1) / 2
              : x0 + (i / (ev.length - 1)) * (x1 - x0);
    const up = i % 2 === 0;
    const ty = up ? axis - tyOff : axis + tyOff;
    /* Les libelles du premier et du dernier evenement, centres sur x0/x1,
       debordaient du cadre a gauche/a droite avec la police agrandie du
       mode compact. On les ancre plutot vers l'interieur. */
    const anchor = COMPACT ? (i === 0 ? 'start' : (i === ev.length - 1 ? 'end' : 'middle')) : 'middle';
    o += '<line x1="' + x.toFixed(1) + '" y1="' + axis + '" x2="' + x.toFixed(1) + '" y2="'
       + (up ? axis - tickLen : axis + tickLen) + '" stroke="' + SV_CREAM + '.35)"/>';
    o += '<circle cx="' + x.toFixed(1) + '" cy="' + axis + '" r="' + dotR + '" fill="#E3E3C4"/>';
    o += '<text x="' + x.toFixed(1) + '" y="' + ty + '" text-anchor="' + anchor + '"'
       + ' font-family="Afacad,sans-serif" font-size="' + whenFont + '" font-weight="700"'
       + ' fill="' + SV_CREAM + '.9)">' + esc(e.when || String(e.y)) + '</text>';
    /* le libelle est coupe en lignes courtes pour ne pas deborder */
    const words = String(e.label || '').split(' ');
    const lines = [];
    let cur = '';
    /* largeur de coupe deduite du nombre d'evenements : plus ils sont
       nombreux, plus les colonnes sont etroites. Le diviseur suit la
       taille de police (V) pour rester correct en compact. */
    const col = (x1 - x0) / Math.max(1, ev.length - 1);
    const charW = V(7, 13);
    const wrap = Math.max(V(11, 7), Math.min(V(24, 15), Math.floor(col / charW)));
    words.forEach(function(w){
      if((cur + ' ' + w).trim().length > wrap){ lines.push(cur.trim()); cur = w; }
      else cur += ' ' + w;
    });
    if(cur.trim()) lines.push(cur.trim());
    lines.slice(0, 3).forEach(function(l, j){
      o += '<text x="' + x.toFixed(1) + '" y="' + (ty + (up ? -firstLine - (lines.length - 1 - j) * lineH : firstLine + j * lineH))
         + '" text-anchor="' + anchor + '" font-family="Afacad,sans-serif" font-size="' + lblFont + '"'
         + ' fill="' + SV_CREAM + '.55)">' + esc(l) + '</text>';
    });
    hots += hot(x, axis, dotR, e.when || String(e.y), e.note || e.label || '', e.label || '');
  });
  return o + hots + '</svg>';
}

/* ---------- bars : une comparaison chiffrée ---------- */
function svBars(d){
  const it = (d.items || []).slice();
  if(!it.length) return '';
  const rowH = V(62, 108);
  const W = 1000, H = V(130, 190) + it.length * rowH;
  const x0 = V(250, 190), x1 = V(860, 900);
  const max = Math.max.apply(null, it.map(function(x){ return x.v; })) || 1;
  let o = svOpen(W, H) + svTitle(d.title || 'Comparaison');
  let hots = '';
  const nameFont = V(16, 26), valFont = V(14, 22), barH = V(22, 38), rx = V(4, 8);
  /* La barre la plus longue allait jusqu'au bord du cadre : au-dela d'une
     police lisible, son etiquette de valeur ("6 000 meteores/heure") n'a
     plus la place de s'afficher a sa droite. On reserve une marge fixe en
     compact plutot que de laisser la barre maximale manger tout l'espace. */
  const barMaxFrac = V(1, 0.72);
  it.forEach(function(x, i){
    const y = V(96, 150) + i * rowH;
    const w = Math.max(3, (x.v / max) * (x1 - x0) * barMaxFrac);
    o += '<text x="' + (x0 - V(22, 16)) + '" y="' + (y + barH/2 + 5) + '" text-anchor="end"'
       + ' font-family="Afacad,sans-serif" font-size="' + nameFont + '" font-weight="700"'
       + ' fill="' + SV_CREAM + '.9)">' + esc(x.n) + '</text>';
    o += '<rect x="' + x0 + '" y="' + y + '" width="' + w.toFixed(1) + '" height="' + barH + '" rx="' + rx + '"'
       + ' fill="' + (x.c || '#E3E3C4') + '" fill-opacity=".3" stroke="' + (x.c || '#E3E3C4')
       + '" stroke-width="1.2"/>';
    o += '<text x="' + (x0 + w + V(14, 16)).toFixed(1) + '" y="' + (y + barH/2 + 5) + '"'
       + ' font-family="Afacad,sans-serif" font-size="' + valFont + '" fill="' + SV_CREAM + '.6)">'
       + esc(x.sub || (nfr(x.v) + (d.unit ? ' ' + d.unit : ''))) + '</text>';
    hots += hot(x0 + w / 2, y + barH/2, Math.max(V(11,20), barH/2), x.n, x.note || '',
                x.sub || (nfr(x.v) + (d.unit ? ' ' + d.unit : '')));
  });
  return o + hots + '</svg>';
}

    return ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'})[c];

};

/* Un visuel manquant n'affiche pas une image cassée : il annonce le
   fichier attendu et renvoie vers la page d'origine. */
function missing(path, page){
  return '<div class="missing">Visuel à déposer<br><code>' + esc(path) + '</code>'
    + (page ? '<br><a href="' + esc(page) + '" target="_blank" rel="noopener">'
              + 'Télécharger depuis la source &nearr;</a>' : '') + '</div>';
}

function figureHTML(f, wide){
  let inner;
  if(f.svg && SVGS[f.svg]) inner = SVGS[f.svg](f.data);
  else if(f.src) inner = '<img src="' + esc(f.src) + '" alt="' + esc(f.alt || '')
    + '" loading="lazy" onerror="this.parentNode.innerHTML=' + "'" + '__MISS__' + "'" + '">';
  else inner = missing('(source absente)');
  const cls = ['frame'];
  if(f.lit) cls.push('lit');
  if(f.roll) cls.push('roll');
  if(f.src && !f.svg) cls.push('zoom');   /* seules les vraies images s'ouvrent */
  let h = '<figure' + (wide ? ' class="wide"' : '') + '>'
    + '<div class="' + cls.join(' ') + '"'
    + (f.cap ? ' data-cap="' + String(f.cap).replace(/"/g, '&quot;') + '"' : '')
    + (f.credit ? ' data-credit="' + String(f.credit).replace(/"/g, '&quot;') + '"' : '')
    + '>' + inner + '</div>';
  if(f.cap || f.credit){
    h += '<figcaption>' + esc(f.cap || '')
      + (f.credit ? '<span class="credit">' + esc(f.credit) + '</span>' : '')
      + '</figcaption>';
  }
  return h + '</figure>';
}
/* on injecte le repli après coup, pour ne pas se battre avec les guillemets */
function withFallback(html, path, page){
  return html.replace('__MISS__', missing(path, page).replace(/'/g, '&#39;').replace(/"/g, '&quot;'));
}

/* Transforme un lien collé en source intégrable.

   Le champ accepte n'importe quelle adresse : on reconnaît les grandes
   plateformes et on retombe sur un lien cliquable pour le reste, plutôt
   que d'afficher un cadre vide. Renvoie soit { embed } pour un iframe,
   soit { file } pour un fichier à lire directement, soit { link } quand la
   plateforme n'est pas reconnue. */
function resolveVideo(raw){
  const url = String(raw || '').trim();
  if(!url) return null;

  /* fichier servi par nos soins, ou lien direct vers un média */
  if(/^\//.test(url) || /\.(mp4|webm|ogv|mov)(\?|#|$)/i.test(url)) return { file: url };

  let u;
  try{ u = new URL(url, location.origin); }catch(e){ return { link: url }; }
  const host = u.hostname.replace(/^www\./, '');
  const seg = u.pathname.split('/').filter(Boolean);

  /* départ dans la vidéo, sous ses différentes écritures */
  const startOf = function(){
    const t = u.searchParams.get('t') || u.searchParams.get('start') || '';
    const m = /^(?:(\d+)h)?(?:(\d+)m)?(\d+)s?$/.exec(t);
    if(m) return (+(m[1]||0))*3600 + (+(m[2]||0))*60 + (+m[3]);
    return /^\d+$/.test(t) ? +t : 0;
  };

  /* YouTube : watch, youtu.be, shorts, live, embed */
  if(/(^|\.)youtube\.com$|^youtu\.be$|^youtube-nocookie\.com$/.test(host)){
    let id = u.searchParams.get('v') || '';
    if(!id && host === 'youtu.be') id = seg[0] || '';
    if(!id && (seg[0] === 'shorts' || seg[0] === 'live' || seg[0] === 'embed')) id = seg[1] || '';
    if(!/^[\w-]{6,20}$/.test(id)) return { link: url };
    const st = startOf();
    return { embed: 'https://www.youtube-nocookie.com/embed/' + id
      + '?rel=0&modestbranding=1' + (st ? '&start=' + st : ''), what: 'YouTube' };
  }

  /* Vimeo : vimeo.com/ID, /channels/x/ID, player.vimeo.com/video/ID */
  if(/(^|\.)vimeo\.com$/.test(host)){
    const id = seg.filter(function(x){ return /^\d{6,}$/.test(x); })[0];
    if(!id) return { link: url };
    /* le jeton h= des vidéos non répertoriées doit être conservé */
    const h = u.searchParams.get('h') || (seg[seg.indexOf(id) + 1] || '');
    return { embed: 'https://player.vimeo.com/video/' + id
      + (/^[0-9a-f]{6,}$/i.test(h) ? '?h=' + h : ''), what: 'Vimeo' };
  }

  /* Dailymotion : dailymotion.com/video/ID, dai.ly/ID */
  if(/(^|\.)dailymotion\.com$|^dai\.ly$/.test(host)){
    const id = host === 'dai.ly' ? seg[0] : (seg[0] === 'video' ? seg[1] : seg[seg.length-1]);
    if(!id) return { link: url };
    return { embed: 'https://geo.dailymotion.com/player.html?video=' + id, what: 'Dailymotion' };
  }

  /* déjà une adresse d'intégration : on la laisse passer telle quelle */
  if(/\/(embed|player)\b/.test(u.pathname)) return { embed: u.href, what: host };

  return { link: url };
}

(function(){

    im.style.transform = transform || '';

      + (credit ? '<span class="credit">' + esc(credit) + '</span>' : '');

    document.body.style.overflow = 'hidden';
  };
  const close = function(){
    lb.classList.remove('vis');

  };

           img.style.transform);

/* ---------- redressement des figures du skyculture ----------
   L'angle est celui que vous validez dans l'outil de vérification : une
   rotation horaire, mesurée dans le repère de l'image. On réduit ensuite
   l'image de juste ce qu'il faut pour que ses coins restent dans le cadre. */
var FIG_ROLL = 0;
function applyFigureRoll(){
  const a = Number(FIG_ROLL) || 0;
  const r = a * Math.PI / 180;
  const k = 1 / (Math.abs(Math.cos(r)) + Math.abs(Math.sin(r)));
  document.querySelectorAll('.frame.roll img').forEach(function(img){
    img.style.transform = a ? ('rotate(' + a + 'deg) scale(' + k.toFixed(4) + ')') : '';
  });
}

/* ---------- infobulle des schémas ----------
   Une seule infobulle pour toute la page, positionnée au pointeur. Les
   zones sensibles sont posées par la fonction hot() dans chaque SVG, et
   sont focalisables au clavier — la souris n'est pas le seul moyen.

   Sur tactile, `pointerover` ne se déclenche pas de façon fiable (il n'y
   a pas de survol) : sans le bloc ci-dessous, l'invite « survolez » des
   légendes ne menait à rien au doigt. Un tap ouvre ou ferme désormais
   l'infobulle de la zone touchée, et un tap ailleurs la referme. */
(function(){
  const tip = document.getElementById('tip');
  if(!tip) return;

  const show = function(el, x, y){
    tip.innerHTML = '<b>' + esc(el.dataset.t || '') + '</b>' + esc(el.dataset.b || '')
      + (el.dataset.n ? '<span class="k">' + esc(el.dataset.n) + '</span>' : '');
    tip.classList.add('on');
    place(x, y);
  };
  const place = function(x, y){
    const r = tip.getBoundingClientRect();
    let left = x + 16, top = y + 16;
    if(left + r.width > innerWidth - 12) left = x - r.width - 16;
    if(top + r.height > innerHeight - 12) top = y - r.height - 16;
    tip.style.left = Math.max(12, left) + 'px';
    tip.style.top  = Math.max(12, top) + 'px';
  };
  const hide = function(){ tip.classList.remove('on'); tip.dataset.pinned = ''; };

  document.addEventListener('pointerover', function(e){
    if(e.pointerType === 'touch') return;   // le tap est gere a part, plus bas
    const h = e.target.closest && e.target.closest('.hot');
    if(h) show(h, e.clientX, e.clientY);
  });
  document.addEventListener('pointermove', function(e){
    if(e.pointerType === 'touch') return;
    if(tip.classList.contains('on')) place(e.clientX, e.clientY);
  });
  document.addEventListener('pointerout', function(e){
    if(e.pointerType === 'touch') return;
    if(e.target.closest && e.target.closest('.hot')) hide();
  });
  /* au clavier : l'infobulle se pose près de la zone focalisée */
  document.addEventListener('focusin', function(e){
    const h = e.target.closest && e.target.closest('.hot');
    if(!h) return;
    const b = h.getBoundingClientRect();
    show(h, b.left + b.width/2, b.top + b.height/2);
  });
  document.addEventListener('focusout', hide);
  addEventListener('scroll', hide, { passive:true });

  /* Au tap : une zone sensible « epingle » son infobulle (elle reste
     ouverte sans que le doigt reste dessus) ; un second tap dessus, ou un
     tap ailleurs, la referme. */
  document.addEventListener('click', function(e){
    const h = e.target.closest && e.target.closest('.hot');
    if(!h){ hide(); return; }
    if(tip.dataset.pinned === 'true' && tip.dataset.pinnedFor === (h.dataset.t || '') + '|' + (h.dataset.b || '')){
      hide();
      return;
    }
    const b = h.getBoundingClientRect();
    show(h, b.left + b.width/2, b.top + b.height/2);
    tip.dataset.pinned = 'true';
    tip.dataset.pinnedFor = (h.dataset.t || '') + '|' + (h.dataset.b || '');
  });
})();

/* Le contenu vient de content/<id>.json quand il existe — c'est ce que le
   Studio écrit dans le dépôt — et du contenu inscrit dans cette page

let content = CONTENT[cid] || {};

const tabsEl = $('#tabs'), panesEl = $('#panes');

function buildTabs(){
  keys = ORDER.filter(function(k){ return content[k] && content[k].length; });

  panesEl.innerHTML = '';

if(!keys.length){
  panesEl.innerHTML = '<div class="soon">Les contenus de cette figure restent à écrire.<br>'
    + 'Ils seront saisis depuis le back-office une fois Supabase en place.</div>';

}else{

  };

  const wb = want && tabsEl.querySelector('.tab[data-key="' + want + '"]');
  if(wb) wb.click();

  applyFigureRoll();
}

buildTabs();

/* Les schemas SVG ci-dessus figent leurs constantes de mise en page (V())
   au moment du rendu : une rotation d'ecran qui fait franchir le seuil de
   760px doit donc reconstruire les panneaux, sinon un iPhone tourne en
   paysage garderait des schemas dessines pour un etroit portrait (ou
   l'inverse). Redondant avec les autres reglages de la page, qui ne
   suivent deja pas la rotation en direct, mais ici le cout de ne pas le
   faire est un schema illisible — ca merite le reflow. */
(function(){
  let t = null;
  addEventListener('resize', function(){
    clearTimeout(t);
    t = setTimeout(function(){
      const nowCompact = matchMedia('(max-width: 760px)').matches;
      if(nowCompact !== COMPACT){
        COMPACT = nowCompact;
        buildTabs();
      }
    }, 180);
  });
})();

/* Un fichier par onglet : content/<id>/<onglet>.json. On les demande tous
   les trois en parallele, un manquant n'est pas une erreur — c'est un
   onglet non redige. L'ancien fichier unique reste lu en secours, le temps
   que toutes les fiches soient migrees. */
(function loadContent(){
  const one = function(tab){
    return fetch('/content/' + cid + '/' + tab + '.json', { cache:'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        return (d && Array.isArray(d.blocks) && d.blocks.length) ? [tab, d.blocks] : null;
      })
      .catch(function(){ return null; });
  };
  Promise.all(ORDER.map(one)).then(function(res){
    const found = {};
    res.forEach(function(x){ if(x) found[x[0]] = x[1]; });
    if(Object.keys(found).length){
      content = found;
      tabsEl.style.display = '';
      buildTabs();
      return;
    }
    /* rien par onglet : on tente l'ancien fichier unique */
    return fetch('/content/' + cid + '.json', { cache:'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if(!d || !Object.keys(d).length) return;
        content = d;
        tabsEl.style.display = '';
        buildTabs();
      })
      .catch(function(){});
  });
})();

/* ============================================================
   LE CIEL RÉEL, UNE SEULE FIGURE, NAVIGATION BLOQUÉE

   Trois réglages font tout le travail :

   1. show_only_pointed = true — c'est le comportement par défaut du
      moteur, que la carte désactive. Il n'affiche que la figure située au
      centre de l'écran, plus celle qui est sélectionnée. En centrant sur
      notre constellation et en la sélectionnant, elle reste donc seule.
   2. pointer-events: none sur le canvas — les gestes du moteur sont posés
      sur cet élément, les couper suffit à interdire toute navigation.
   3. time_speed = 0 — le ciel est figé sur l'instant du chargement, la
      figure ne dérive donc pas pendant la lecture.
   ============================================================ */
const ENGINE_JS   = '/vendor/stellarium-web-engine.js';
const ENGINE_WASM = '/vendor/stellarium-web-engine-ekko2.wasm';
const SKYDATA     = 'https://cdn.jsdelivr.net/gh/liudonghua123/stellarium-web-engine@453e155185a6060711e533f9bf8d0334b2ae862f/skydata/';
const AFACAD_TTF  = '/vendor/Afacad-variable.ttf';
const D2R = Math.PI / 180;

/* même convention que la carte : le repère OBSERVED du moteur est
   gaucher, l'angle signé sort donc inversé */
const ROLL_SIGN = -1;
let ROLL_ADJUST = {};

let STEL = null;

function skyFilters(stel){
  const core = stel.core, set = function(f){ try{ f(); }catch(e){} };
  set(function(){ core.constellations.lines_visible      = true;  });
  set(function(){ core.constellations.labels_visible     = false; });  /* le titre est dans la page */
  set(function(){ core.constellations.images_visible     = false; });  /* la sélection l'affichera */
  set(function(){ core.constellations.bounds_visible     = false; });
  set(function(){ core.constellations.lines_animation    = false; });
  set(function(){ core.constellations.show_only_pointed  = true;  });
  set(function(){ core.stars.visible        = true;  });
  set(function(){ core.stars.labels_visible = true;  });
  set(function(){ core.milkyway.visible     = true;  });
  ['atmosphere','landscapes','dsos','dss','planets','satellites','comets','minor_planets']
    .forEach(function(m){ set(function(){ core[m].visible = false; }); });
  ['azimuthal','equatorial','meridian','ecliptic']
    .forEach(function(l){ set(function(){ core.lines[l].visible = false; }); });
  set(function(){ core.time_speed = 0; });   /* ciel figé */
}

/* Centrage : on demande sa position au moteur, et le champ se déduit de
   l'étendue réelle de la figure. */
function frameFigure(stel){
  const iau = IAU[cid];
  try{
    let ctr = null;
    if(iau){
      const o = stel.getObj('CON ekko ' + iau);
      if(o){
        const rd = o.getInfo('radec', stel.core.observer);
        if(rd) ctr = [rd[0], rd[1], rd[2]];
        stel.core.selection = o;      /* la figure reste seule, et son dessin apparaît */
      }
    }
    if(!ctr){
      /* barycentre de nos propres étoiles, en secours */
      let x = 0, y = 0, z = 0;
      C.s.forEach(function(s){
        const ra = s[0]*15*D2R, dec = s[1]*D2R;
        x += Math.cos(dec)*Math.cos(ra); y += Math.cos(dec)*Math.sin(ra); z += Math.sin(dec);
      });
      ctr = [x, y, z];
    }
    const ob = stel.convertFrame(stel.core.observer, 'ICRF', 'OBSERVED', ctr);
    stel.lookAt(ob, 0);
    stel.zoomTo(figureFov() * D2R, 0);
    applyRoll(stel);
  }catch(e){ console.warn('[ekko] cadrage :', e); }
}

function figureFov(){
  /* rayon angulaire maximal depuis le barycentre, puis marge */
  let x = 0, y = 0, z = 0;
  const v = C.s.map(function(s){
    const ra = s[0]*15*D2R, dec = s[1]*D2R;
    const u = [Math.cos(dec)*Math.cos(ra), Math.cos(dec)*Math.sin(ra), Math.sin(dec)];
    x += u[0]; y += u[1]; z += u[2];
    return u;
  });
  const n = Math.hypot(x, y, z) || 1; x /= n; y /= n; z /= n;
  let max = 0;
  v.forEach(function(u){
    const d = Math.max(-1, Math.min(1, u[0]*x + u[1]*y + u[2]*z));
    max = Math.max(max, Math.acos(d) / D2R);
  });
  return Math.max(22, Math.min(95, max * 2.7 + 10));
}

/* Redressement : le haut de l'illustration pointe vers le haut de l'écran. */
function applyRoll(stel){
  const o = ORIENT[cid];
  if(!o){ try{ stel.core.observer.roll = 0; }catch(e){} return; }
  const dot = function(a, b){ return a[0]*b[0] + a[1]*b[1] + a[2]*b[2]; };
  const nrm = function(v){ const n = Math.hypot(v[0],v[1],v[2]) || 1; return [v[0]/n,v[1]/n,v[2]/n]; };
  const crs = function(a, b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; };
  try{
    const obs = stel.core.observer;
    const c = nrm(stel.convertFrame(obs, 'ICRF', 'OBSERVED', stel.s2c(o[0]*15*D2R, o[1]*D2R)));
    const u = nrm(stel.convertFrame(obs, 'ICRF', 'OBSERVED', stel.s2c(o[2]*15*D2R, o[3]*D2R)));
    const Z = [0, 0, 1];
    if(Math.abs(dot(Z, c)) > 0.999) return;
    const tang = function(v){ const d = dot(v, c); return nrm([v[0]-d*c[0], v[1]-d*c[1], v[2]-d*c[2]]); };
    const up = tang(u), u0 = tang(Z);
    const theta = Math.atan2(dot(crs(u0, up), c), dot(u0, up));
    const adj = (ROLL_ADJUST[cid] || 0) * D2R;
    obs.roll = ROLL_SIGN * (theta + adj);
  }catch(e){ console.warn('[ekko] orientation :', e); }
}

function bootSky(lat, lon){

      Promise.all([stel.setFont('regular', AFACAD_TTF), stel.setFont('bold', AFACAD_TTF)])
        .catch(function(){});
      stel.core.stars.addDataSource({ url: SKYDATA + 'stars' });
      stel.core.skycultures.addDataSource({ url: '/skyculture/ekko', key: 'ekko' });
      stel.core.milkyway.addDataSource({ url: SKYDATA + 'surveys/milkyway' });
      skyFilters(stel);
      try{
        stel.core.observer.latitude  = lat * D2R;
        stel.core.observer.longitude = lon * D2R;
        stel.core.observer.utc = stel.date2MJD(new Date());
      }catch(e){}
      activateSkyculture(stel);
      $('#live').textContent = 'Ciel réel, figé';
    }
  });
}

/* corrections d'angle validées depuis l'outil de vérification */
fetch('/skyculture/ekko/roll-adjust.json', { cache: 'no-store' })
  .then(function(r){ return r.ok ? r.json() : {}; })
  .then(function(t){
    ROLL_ADJUST = t || {};
    if(STEL) applyRoll(STEL);
    /* le même angle redresse les illustrations affichées dans la page */
    FIG_ROLL = ROLL_ADJUST[cid] || 0;
    applyFigureRoll();
  })
  .catch(function(){});

const FB = { lat: 41.39, lon: 2.17 };
/* Le moteur (le plus lourd de cette page) n'a pas de raison de charger
   pour quelqu'un que requireAuth() est en train de renvoyer vers le
   portail — voir le tout debut de ce script. */
__ekkoAuthOk.then(function(ok){
  if(!ok) return;
  import('/js/geo.js').then(function(m){
    return m.getCachedPosition(FB);
  }).then(function(pos){
    bootSky(pos.lat, pos.lon);
  });
});
</script>
