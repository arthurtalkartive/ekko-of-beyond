      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.82-.07-1.42-.22-2.05H12v3.9h6.62c-.13 1.1-.86 2.76-2.47 3.87l-.02.15 3.59 2.78.25.02c2.28-2.1 3.55-5.2 3.55-8.67"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.94-2.9l-3.79-2.94c-1.01.7-2.37 1.2-4.15 1.2-3.17 0-5.86-2.1-6.82-5.02l-.14.01-3.72 2.88-.05.14C3.25 21.3 7.28 24 12 24"/><path fill="#FBBC05" d="M5.18 14.34a7.4 7.4 0 0 1-.4-2.34c0-.82.15-1.6.39-2.34l-.01-.16-3.77-2.94-.12.06A11.93 11.93 0 0 0 0 12c0 1.93.47 3.76 1.27 5.38z"/><path fill="#EA4335" d="M12 4.75c2.26 0 3.78.97 4.65 1.79l3.39-3.31C17.94 1.19 15.24 0 12 0 7.28 0 3.25 2.7 1.27 6.62l3.9 3.04c.97-2.92 3.66-4.91 6.83-4.91"/></svg>
      <span>Connexion avec Google</span>
    </button>

    <div class="auth-or">
      <span class="ln-wrap"><span class="d5"></span><span class="r7"></span><span class="ln"></span></span>
      <span>ou</span>
      <span class="ln-wrap"><span class="ln"></span><span class="r7"></span><span class="d5"></span></span>
    </div>

    <div class="auth-fields">
      <div class="auth-row">
        <div class="auth-field"><input type="text" name="first_name" placeholder="Nom" autocomplete="family-name" required></div>
        <div class="auth-field"><input type="text" name="last_name" placeholder="Prénom" autocomplete="given-name" required></div>
      </div>
      <div class="auth-field"><input type="email" name="email" placeholder="Adresse email" autocomplete="email" required></div>
      <div class="auth-field"><input type="password" name="password" placeholder="Mot de passe" autocomplete="new-password" minlength="6" required></div>
    </div>

    <div class="auth-msg" id="msg"></div>

    <div class="auth-actions">
      <button type="submit" class="auth-submit" id="submit-btn">
        <span class="txt">Démarrer l'aventure</span>
        <span class="spin"></span>
      </button>
      <a class="auth-switch" href="/connexion">J'ai déjà un compte</a>
    </div>
  </form>
</main>

<script type="module">
import { supabase, getSession, friendlyAuthError } from '/js/supa.js';
import { startBgm, mountMuteButton } from '/js/bgm.js';

/* Musique de fond, reprise a la position laissee par la page precedente
   (voir js/bgm.js) : pas de fade in ici, la scene est deja en cours. */
const bgmAudio = startBgm({ fadeIn: false });
mountMuteButton(bgmAudio);


(function(){
  const img = document.querySelector('#auth-bg img');
  const show = () => img.classList.add('ready');
  if(img.complete) show(); else img.addEventListener('load', show);
})();

/* Deja connecte ? Pas besoin de repasser par l'inscription. */
getSession().then((s) => { if(s) location.href = '/'; });

const form = document.getElementById('form');
const msg = document.getElementById('msg');
const submitBtn = document.getElementById('submit-btn');

function showMsg(text, kind){
  msg.textContent = text;
  msg.className = 'auth-msg on ' + kind;
}
function setLoading(on){
  submitBtn.disabled = on;
  submitBtn.classList.toggle('loading', on);
}

document.getElementById('google-btn').addEventListener('click', async () => {
  const { error } = await supabase.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: location.origin + '/' },
  });
  if(error) showMsg(friendlyAuthError(error), 'err');
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(form);
  const first_name = fd.get('first_name').trim();
  const last_name = fd.get('last_name').trim();
  const email = fd.get('email').trim();
  const password = fd.get('password');

  if(!first_name || !last_name || !email || !password){
    showMsg('Merci de remplir tous les champs.', 'err');
    return;
  }

  setLoading(true);
  const { data, error } = await supabase.auth.signUp({
    email, password,
    options: { data: { first_name, last_name } },
  });
  setLoading(false);

  if(error){ showMsg(friendlyAuthError(error), 'err'); return; }
  if(data.session){ location.href = '/'; return; }
  /* Pas de session immediate : la confirmation par email est activee
     cote Supabase malgre tout (reglage par defaut a desactiver dans
     Authentication > Providers > Email si besoin). */
  showMsg('Compte créé — vérifie ta boîte mail pour confirmer ton adresse.', 'ok');
});
</script>
</body>
</html>
